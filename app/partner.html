<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 自動當沖夥伴版 預覽(partner 分支;範例資料,不連雲端、不連主機、不下單)。不要和 app/app.html 混在一起 -->
<title>自動當沖夥伴版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面:手機一欄,上標題、中間內容捲動、底部五鍵;單一深色(照設計畫布) */
:root{
  --ground:#0B0E14; --bg:#12161F; --card:#1B2232; --card2:#172033; --line:#2A3244; --line2:#3A4357;
  --fg:#E6EAF2; --sub:#9AA4B8; --soft:#C9D1DF; --gold:#FFD54F; --goldbg:#2A2410;
  --up:#FF5A5F; --down:#3DDC84; --ok:#22C55E; --okt:#6EE7A0; --bad:#FF3B3B; --badt:#FF8A8A; --badbg:#2A1416;
  --f:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font-family:var(--f);margin:0}
*{box-sizing:border-box}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:440px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.pv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:#0E121A;border-bottom:1px dashed var(--line2);font-size:13px;color:var(--sub)}
.pv b{color:var(--gold);font-weight:700}
.pv button{height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--soft);font-size:13px;cursor:pointer}
.pv button.on{border-color:var(--gold);background:var(--goldbg);color:var(--gold);font-weight:700}
.hd{padding:12px 16px 10px;border-bottom:1px solid var(--gold);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd h1{margin:0;font-size:24px;font-weight:900;letter-spacing:1px;color:var(--gold)}
.tag{font-size:12px;color:var(--gold);border:1px solid #5A4A10;border-radius:6px;padding:2px 6px;white-space:nowrap}
main{flex:1;overflow:auto;padding:0 12px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;padding-top:12px}
.b{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--soft);font:700 17px var(--f);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b.green{border:2px solid var(--ok);background:#0E1A12;color:var(--ok)}
.b.gold{border:2px solid var(--gold);background:var(--gold);color:var(--bg);font-weight:900}
.b.goldo{border:1px solid var(--gold);background:var(--card);color:var(--gold)}
.b.red{border:1px solid var(--up);background:var(--badbg);color:#FF8A8E}
.b.full{flex:1}
.pill{height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;font-size:17px;color:var(--soft)}
.big{flex:1;text-align:right;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--down)} .mut{color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:var(--soft);font:500 15px var(--f);cursor:pointer}
.chip.on{border-color:var(--gold);background:var(--goldbg);color:var(--gold);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border-radius:10px;padding:10px;text-align:center}
.stat small{display:block;font-size:13px;color:var(--sub)}
.stat strong{font-size:22px;font-variant-numeric:tabular-nums}
.lab{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px}
.prow{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:inherit;cursor:pointer;font:inherit}
.prow.sel{border-color:var(--gold)} .prow.dead{border-color:#5A2424}
.dot{width:10px;height:10px;border-radius:5px;background:var(--ok);flex:none} .dot.r{background:var(--bad)}
.prow .nm{font-size:20px;font-weight:700} .prow .ds{font-size:13px;color:var(--sub)}
.prow .pn{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.trade{background:var(--card);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.trade.hold{background:var(--card2);border:1px dashed var(--line2)}
.side{font-size:13px;font-weight:700;border:1px solid;border-radius:4px;padding:1px 4px;flex:none}
.side.s{color:var(--down)} .side.l{color:var(--up)}
.trade .nm{flex:1;min-width:0;font-size:18px;font-weight:700}
.trade .nm span{font-size:13px;color:var(--sub);font-weight:400}
.trade .px{font-size:15px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.trade .pn{width:72px;text-align:right;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.cfg{background:var(--card);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:14px;color:#B8C1D3}
.link{background:none;border:0;color:var(--gold);font:700 14px var(--f);cursor:pointer;padding:0;justify-self:end}
.note{padding:10px 12px;border-radius:10px;background:#161B26;border:1px solid var(--line);font-size:14px;color:#B8C1D3;line-height:1.6}
.note.warn{border-color:#5A4A10;color:#E9D9A0}
.alert{background:#3A0E12;border:2px solid var(--bad);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.alert h2{margin:0;font-size:21px;font-weight:900;color:#FFD0D0;display:flex;gap:8px;align-items:center}
.alert p{margin:0;font-size:15px;color:#FFC2C2;line-height:1.6}
.arow{background:#2A0A0D;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:16px}
.msg{background:var(--card);border-radius:10px;padding:10px 12px} .msg b{font-size:16px} .msg div{font-size:13px;color:var(--sub)}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big3 button{height:96px;border-radius:12px;border:2px solid var(--gold);background:var(--goldbg);color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:900 22px var(--f);cursor:pointer}
.cap3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px;color:var(--sub);text-align:center;line-height:1.4}
.set{background:var(--card);border-radius:10px;padding:0 12px;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px}
.set b{font-weight:700}
.prt{background:var(--card);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) 72px 52px;gap:6px;align-items:center}
.prt.new{border:1px solid #5A4A10}
.prt .nm{font-size:19px;font-weight:700;background:none;border:0;color:inherit;padding:0;cursor:pointer;text-align:left;font-family:inherit}
.prt .k{font-size:13px;color:var(--sub)} .st{font-size:12px} .st.g{color:var(--okt)} .st.r{color:var(--badt)} .st.y{color:var(--gold)}
.sw{justify-self:center;width:60px;height:32px;border-radius:16px;background:var(--line2);border:0;position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:var(--soft);transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:31px;background:#fff}
.sw:disabled{cursor:default;opacity:.8}
.rm{justify-self:center;width:44px;height:44px;border-radius:10px;border:1px solid #5A2424;background:var(--badbg);color:#FF8A8E;font:700 20px var(--f);cursor:pointer}
.jg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jb{height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--sub);font:700 17px var(--f);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.jb.on{border-color:var(--ok);color:var(--ok);background:#0E1A12}
.jb:disabled{cursor:default}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:14px;color:var(--sub)}
.fld .in{display:flex;align-items:center;gap:8px}
.fld input{flex:1;min-width:0;height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--fg);font-size:18px;padding:0 12px}
.fld .u{font-size:16px;color:var(--sub)}
.fld .hint{font-size:12px;color:var(--sub)}
.fld .err{font-size:13px;color:var(--badt)}
.ro{display:flex;justify-content:space-between;background:var(--card);border-radius:10px;padding:12px;font-size:17px}
.steps{display:flex;flex-direction:column;gap:6px;font-size:15px}
.steps div{display:flex;gap:8px;align-items:center}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:10px 8px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
nav button{height:48px;border-radius:10px;border:1px solid var(--gold);background:var(--card);color:var(--soft);font:700 17px var(--f);cursor:pointer}
nav button.on{border:2px solid var(--ok);color:var(--ok)}
.mask{position:fixed;inset:0;background:rgba(5,7,12,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.dlg{width:100%;max-width:380px;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:19px;font-weight:900;color:var(--gold)}
.dlg ul{margin:0;padding-left:20px;font-size:16px;line-height:1.7}
.dlg p{margin:0;font-size:14px;color:#B8C1D3;line-height:1.6}
.dlg .bt{display:flex;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#0E1A12;border:1px solid var(--ok);color:var(--okt);padding:10px 14px;border-radius:10px;font-size:15px;z-index:30;max-width:90%}
.ph{background:var(--card);border-radius:12px;padding:24px 16px;text-align:center;color:var(--sub);font-size:15px;line-height:1.7}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="pv" aria-label="預覽設定">
    <span>預覽身分</span>
    <button type="button" id="pv-owner" class="on">主導$ 的手機</button>
    <button type="button" id="pv-fam">夥伴A 的手機</button>
    <span style="flex:1"></span><b>範例資料</b>
  </div>
  <header class="hd"><h1>自動當沖夥伴版</h1><span class="tag" id="who">主導$</span></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="layer"></div>

<script>
// 自動當沖夥伴版 預覽(2026-11-15 使用者「夥伴版在修改期間 暫時用html 呈現實際效果」)
// 只是畫面:資料都是範例,不連雲端、不連主機、不會下單。App 不寫看時間決定行為的邏輯。
const J9 = ["判一","判二","判三","判四","判五","判六","判七","判八","判九"];
const allOn = (off=[]) => Object.fromEntries(J9.map(j => [j, !off.includes(j)]));
const P = [
  {name:"主導$", owner:true, alive:true, n:9, win:8, amount:500, cfg:{judges:allOn(), max_amount:500, cap:25, max_loss:2, kill_loss:5, enabled:true}, last4:"5861",
   hold:[{s:"s",nm:"聯強",j:"判二",t:"10:15",a:"62.4",b:"61.9",p:1480}],
   fills:[{s:"s",nm:"華邦電",a:"48.20",b:"47.05",p:3410},{s:"l",nm:"廣達",a:"288.0",b:"291.5",p:3120},{s:"s",nm:"群創",a:"17.35",b:"17.05",p:2690}]},
  {name:"夥伴A", alive:true, n:8, win:7, amount:300, last4:"1234", key:"a3c9", bound:true, st:{api:1,cert:1,login:1,at:"08:31"},
   cfg:{judges:allOn(["判八"]), max_amount:300, cap:15, max_loss:2, kill_loss:5, enabled:true},
   hold:[{s:"s",nm:"聯電",j:"判六",t:"10:42",a:"108.5",b:"107.0",p:2780},{s:"s",nm:"台塑",j:"判三",t:"11:05",a:"72.1",b:"72.4",p:-860}],
   fills:[{s:"s",nm:"碩禾",a:"145.00",b:"137.75",p:6933},{s:"s",nm:"欣銓",a:"217.0",b:"214.0",p:2522},{s:"l",nm:"台塑化",a:"98.90",b:"101.37",p:4494},{s:"s",nm:"鈺創",a:"102.5",b:"104.0",p:-3534}]},
  {name:"夥伴B", alive:true, n:7, win:6, amount:200, last4:"8810", key:"07be", bound:true, st:{api:1,cert:1,login:1,at:"08:31"},
   cfg:{judges:allOn(), max_amount:200, cap:10, max_loss:1.5, kill_loss:4, enabled:true},
   hold:[{s:"s",nm:"力積電",j:"判一",t:"09:48",a:"21.30",b:"21.05",p:740}],
   fills:[{s:"s",nm:"南亞科",a:"56.8",b:"55.9",p:2610},{s:"l",nm:"緯創",a:"112.0",b:"113.5",p:2890}]},
  {name:"夥伴C", alive:true, n:7, win:6, amount:500, last4:"3307", key:"5d21", bound:true, st:{api:1,cert:1,login:1,at:"08:32"},
   cfg:{judges:allOn(), max_amount:500, cap:25, max_loss:2, kill_loss:5, enabled:false}, hold:[],
   fills:[{s:"s",nm:"長榮航",a:"38.65",b:"37.90",p:4380},{s:"s",nm:"陽明",a:"71.2",b:"70.1",p:6410}]},
  {name:"夥伴D", alive:true, n:6, win:5, amount:150, last4:"9021", key:"e410", bound:false, st:{api:1,cert:0,login:0,msg:"找不到憑證"},
   cfg:{judges:allOn(["判七","判八"]), max_amount:150, cap:8, max_loss:1, kill_loss:3, enabled:true},
   hold:[{s:"s",nm:"欣銓",j:"判五",t:"11:20",a:"216.5",b:"215.0",p:1360}], fills:[{s:"s",nm:"嘉澤",a:"1,215",b:"1,190",p:7090}]},
  {name:"夥伴E", alive:false, n:0, win:0, amount:0, last4:"", key:"", bound:false, st:null,
   cfg:{judges:allOn(), max_amount:100, cap:5, max_loss:1, kill_loss:2, enabled:false}, hold:[], fills:[{s:"s",nm:"彩晶",a:"9.85",b:"9.93",p:-780}]},
];
const pnl = p => p.hold.reduce((a,x)=>a+x.p,0) + p.fills.reduce((a,x)=>a+x.p,0);
const fmt = v => (v>0?"+":v<0?"−":"") + Math.abs(Math.round(v)).toLocaleString("en-US");
const cls = v => v>0?"up":v<0?"dn":"mut";
const wan = v => (+v).toLocaleString("en-US",{maximumFractionDigits:1}) + " 萬";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const on = c => J9.filter(j => c.judges[j]).length;

const S = { me:"owner", tab:"明細", view:"fam", sel:"全部", person:"夥伴A", ctl:"夥伴A", draft:null, edit:null };
const $ = id => document.getElementById(id);
const main = $("main"), nav = $("nav"), layer = $("layer");
const byName = n => P.find(p => p.name === n);
const mine = () => byName("夥伴A");

function go(view, extra){ Object.assign(S, {view}, extra||{}); render(); main.scrollTop = 0; }
function toast(t){ layer.insertAdjacentHTML("beforeend", `<div class="toast" role="status">${esc(t)}</div>`); const el = layer.lastElementChild; setTimeout(()=>el.remove(), 2600); }
function ask(title, items, note, okText, onOk, danger){
  layer.innerHTML = `<div class="mask"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(title)}</h3>
    ${items.length?`<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}${note?`<p>${esc(note)}</p>`:""}
    <div class="bt"><button type="button" class="b full" id="dlg-no">取消</button><button type="button" class="b full ${danger?"red":"gold"}" id="dlg-ok">${esc(okText)}</button></div></div></div>`;
  $("dlg-no").onclick = () => layer.innerHTML = "";
  $("dlg-ok").onclick = () => { layer.innerHTML = ""; onOk(); };
  $("dlg-ok").focus();
}

const trade = (x, hold) => `<div class="trade${hold?" hold":""}"><span class="side ${x.s}">${x.s==="s"?"空":"多"}</span>
  <div class="nm">${esc(x.nm)}${hold&&x.j?` <span>${esc(x.j)} · ${esc(x.t)}</span>`:""}</div>
  <div class="px">${esc(x.a)} → ${esc(x.b)}</div><div class="pn ${cls(x.p)}">${fmt(x.p)}</div></div>`;

// ① 夥果:全家
function vFam(){
  const shown = S.sel === "全部" ? P : P.filter(p => p.name === S.sel);
  const tot = shown.reduce((a,p)=>a+pnl(p),0), n = shown.reduce((a,p)=>a+p.n,0), w = shown.reduce((a,p)=>a+p.win,0), h = shown.reduce((a,p)=>a+p.hold.length,0);
  return `<div class="row"><button type="button" class="b green">明細</button><div class="pill">11/16</div><button type="button" class="b gold">全家</button><div class="big ${cls(tot)}">${fmt(tot)}</div></div>
  <div class="chips">${["全部",...P.map(p=>p.name)].map(c=>`<button type="button" class="chip${S.sel===c?" on":""}" data-sel="${esc(c)}">${esc(c)}${c==="全部"?" "+P.length:""}</button>`).join("")}</div>
  <div class="stats"><div class="stat"><small>今日筆數</small><strong>${n}</strong></div><div class="stat"><small>勝率</small><strong>${n?(w/n*100).toFixed(1)+"%":"—"}</strong></div><div class="stat"><small>持倉中</small><strong>${h} 檔</strong></div></div>
  <div class="lab"><span>每個人</span><span>點一列看明細</span></div>
  <div class="list">${shown.map(p=>`<button type="button" class="prow${p.alive?"":" dead"}${S.sel===p.name?" sel":""}" data-person="${esc(p.name)}">
    <span class="dot${p.alive?"":" r"}"></span><span class="grow"><span class="nm" style="display:block">${esc(p.name)}</span>
    <span class="ds" style="display:block${p.alive?"":";color:var(--badt)"}">${p.alive?`${p.n} 筆 · 勝 ${p.win} · 持倉 ${p.hold.length} · 額度 ${wan(p.cfg.max_amount)}`:`程式 3 分鐘沒回報 · 持倉 ${p.hold.length}`}</span></span>
    <span class="pn ${cls(pnl(p))}">${fmt(pnl(p))}</span></button>`).join("")}</div>
  <div class="note">紅燈 = 那位的電腦程式 3 分鐘沒回報。這頁只有主導$ 看得到。</div>`;
}

// ② 夥果:點進某人
function vPerson(){
  const p = byName(S.person), c = p.cfg, t = pnl(p);
  return `<div class="row"><button type="button" class="b" data-go="fam">‹ 全家</button><div class="pill" style="background:var(--gold);color:var(--bg);font-weight:900;border:0">${esc(p.name)}</div><div class="big ${cls(t)}">${fmt(t)}</div></div>
  <div class="chips">${P.map(q=>`<button type="button" class="chip${q.name===p.name?" on":""}" data-person="${esc(q.name)}">${esc(q.name)}</button>`).join("")}</div>
  <div class="cfg"><div>帳號 ${p.last4?"…"+esc(p.last4):"還沒設定"}</div>${p.owner?"<div></div>":`<button type="button" class="link" data-ctl="${esc(p.name)}">改設定 ›</button>`}
    <div>當日總額度 ${wan(c.max_amount)}</div><div>判一~九:${on(c)} 個開</div>
    <div>多空上限 ${wan(c.cap)}</div><div>自動交易 ${c.enabled?"開":"關"}</div>
    <div>${wan(c.max_loss)}停止進場</div><div>${wan(c.kill_loss)}全部平倉</div></div>
  <div class="lab"><span>持倉中 ${p.hold.length}</span></div>

       : `<div class="note">按「確定」會先跳確認。改了以後新進場照新設定,已經在場上的部位不受影響(「帳面虧多少全部平倉」除外)。</div>
          <button type="button" class="b gold" id="apply">確定(套用到${esc(p.name)})</button>`}`;
}
function applyCtl(){
  const p = byName(S.ctl), d = S.draft, lim = {max_amount:[1,500], cap:[0,25], max_loss:[0.1,500], kill_loss:[0.1,500]}, labs = {max_amount:"當日總額度",cap:"多空上限",max_loss:"停止進場虧損",kill_loss:"全部平倉虧損"};
  let bad = false;
  for (const k in lim){ const el = $("f-"+k), v = parseFloat(el.value), [lo,hi] = lim[k];
    $("e-"+k).textContent = (!isFinite(v) || v < lo || v > hi) ? `要在 ${lo}~${hi} 萬之間` : "";
    if ($("e-"+k).textContent) bad = true; else d[k] = v; }
  if (bad) return;
  const ch = [];
  J9.forEach(j => { if (!!d.judges[j] !== !!p.cfg.judges[j]) ch.push(`${j}:${p.cfg.judges[j]?"開":"關"} → ${d.judges[j]?"開":"關"}`); });
  for (const k in lim) if (d[k] !== p.cfg[k]) ch.push(`${labs[k]} ${wan(p.cfg[k])} → ${wan(d[k])}`);
  if (!ch.length) return toast(`【${p.name}】的設定沒有變`);
  ask(`確定改【${p.name}】的設定?`, ch, `新進場才照新設定。${ch.some(x=>x.startsWith("全部平倉"))?"「帳面虧多少全部平倉」會馬上生效。":""}(預覽:只改畫面,還沒送到主機)`, "確定", () => {
    p.cfg = JSON.parse(JSON.stringify({...d, _n:undefined})); delete p.cfg._n; S.draft = null; render(); toast(`已套用到【${p.name}】`); });
}

function submitEdit(e){
  e.preventDefault();
  const nm = $("pf-name").value.trim(), ac = $("pf-acct").value.trim(), ex = S.edit ? byName(S.edit) : null;
  $("pe-name").textContent = !/^[^\s|:\/\\?#&<>"']{1,12}$/.test(nm) ? "名字最多 12 個字,不能有空白或符號" : (!ex && byName(nm)) ? "已經有這個名字" : "";
  $("pe-acct").textContent = (ac || !ex) && !/^\d{11}$/.test(ac) ? "帳號要 11 碼數字" : "";
  if ($("pe-name").textContent || $("pe-acct").textContent) return;
  ["pf-pw","pf-pfxpw"].forEach(id => $(id).value = "");   // 預覽:不保留、不送出任何密碼
  const steps = $("pf-steps").querySelectorAll(".steps div"), labs = ["憑證匯入","元大 API","登入成功","產生金鑰 QR Code"];
  let i = 0; const tick = () => { if (i < steps.length){ steps[i].textContent = "✓ " + labs[i]; steps[i].style.color = "var(--okt)"; i++; setTimeout(tick, 450); }
    else { const p = ex || {name:nm, alive:true, n:0, win:0, amount:0, hold:[], fills:[], cfg:{judges:allOn(), max_amount:100, cap:5, max_loss:1, kill_loss:2, enabled:false}};
      Object.assign(p, {last4: ac ? ac.slice(-4) : p.last4, key: p.key || Math.random().toString(16).slice(2,6), bound: p.bound || false, st:{api:1,cert:1,login:1,at:"08:30"}});
      if (!ex) P.push(p); toast(`預覽:【${nm}】設定完成(沒有真的送出)`); go("partners"); } };
  tick();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (t.id === "pv-owner" || t.id === "pv-fam"){ S.me = t.id === "pv-fam" ? "fam" : "owner"; S.view = "fam"; S.draft = null; return render(); }
  if (d.tab){ S.tab = d.tab; S.view = d.tab === "設定" ? "settings" : "fam"; S.draft = null; return render(); }
  if (d.sel){ S.sel = d.sel; return render(); }
  if (d.person){ return go("person", {tab:"明細", person:d.person}); }
  if (d.go){ return go(d.go); }
  if (d.ctl){ S.draft = null; return go("control", {tab:"設定", ctl:d.ctl}); }
  if (d.edit !== undefined){ return go("edit", {edit:d.edit || null}); }
  if (d.j && S.draft){ S.draft.judges[d.j] = !S.draft.judges[d.j];
    document.querySelectorAll("[data-k]").forEach(i => { const v = parseFloat(i.value); if (isFinite(v)) S.draft[i.dataset.k] = v; });
    return render(); }
  if (d.auto){ const p = byName(d.auto), v = !p.cfg.enabled;
    return ask(`確定${v?"開啟":"關閉"}【${p.name}】自動交易?`, [], v ? "開啟後照【"+p.name+"】的設定自動新進場。" : "關掉後不再新進場;已在場上的部位照常停損停利、13:20 平倉。", v?"開啟":"關閉",
      () => { p.cfg.enabled = v; render(); toast(`【${p.name}】自動交易${v?"開":"關"}(預覽)`); }, !v); }
  if (d.rm){ const p = byName(d.rm);
    return ask(`確定移除【${p.name}】?`, [], "金鑰會停用、不再自動交易。已在場上的部位照常停損停利、13:20 平倉。", "移除", () => { P.splice(P.indexOf(p),1); render(); toast(`已移除【${p.name}】(預覽)`); }, true); }
  if (t.id === "close-all"){ const p = byName(S.person);
    return ask(`確定平倉【${p.name}】全部 ${p.hold.length} 檔?`, p.hold.map(x=>`${x.nm} ${x.s==="s"?"空":"多"}`), "預覽:只改畫面,不會真的送平倉指令。", "平倉", () => { p.hold = []; render(); toast(`【${p.name}】全部平倉(預覽)`); }, true); }
