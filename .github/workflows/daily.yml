name: 每日台股資料(pool.js + 分K)

on:
  schedule:
    # cron 用 UTC,台灣 = UTC+8
    # 週一~週五 14:30 台灣時間(收盤 13:30 後一小時)
    - cron: "30 6 * * 1-5"
    # 備援:16:30 台灣時間再跑一次(第一次若剛好失敗,這次補上;資料會合併不會重複)
    - cron: "30 8 * * 1-5"
    # 備援 2:18:30 台灣時間(GitHub 排程常延遲 1~6 小時,多排幾個時段確保當天一定有一次成功)
    - cron: "30 10 * * 1-5"
    # 備援 3:20:30 台灣時間
    - cron: "30 12 * * 1-5"
  workflow_dispatch:      # 也可以到 Actions 頁面手動按 Run workflow

permissions:
  contents: write         # 要能 commit 回 repo

# 2026-11-22 使用者「全部做」(D6):原本 daily / recheck / live-entries / full_hist 共用 group: daily。
#   GitHub 同一組最多 1 個執行中 + 1 個排隊,新排進來的會把排隊中的「靜靜取消」(cancel-in-progress: false 也一樣)
#   → 例如延遲的 live-entries / recheck 會把 14:30 的 daily 擠掉。改成每支自己一組;
#   會寫同一個檔的(daily ↔ recheck 的 pool.json、daily ↔ taiex-1m 的 kline_futures/TXF)由下面 commit 步驟的重試處理。
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 存今天的雲端 1 分K(盤中判別式用的那份,回測 KSRC=cloud 讀;要在換明天名單之前)
        run: |
          D=$(TZ=Asia/Taipei date +%F); echo "D_TW=$D" >> "$GITHUB_ENV"   # 2026-11-22(D6):commit 重試時要用同一天補台指期 K
          python save_cloud_bars.py "$D" || echo "雲端 1 分K 存檔失敗(不影響其他步驟)"

      - name: 產生 pool.js / pool.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python make_pool.py

      - name: 抓分K(Yahoo 1 分K,合併進 kline/)
        run: python fetch_kline.py

      - name: 每週五重學試算機率表(app/prob_model.json,約 10 秒)
        run: |
          if [ "$(TZ=Asia/Taipei date +%u)" = "5" ]; then pip install -q numpy && python tools/backtest/prob_model.py || echo "機率表重學失敗(不影響其他步驟)"; fi

      - name: Commit 回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool.js pool.json pool_prev.json pool_full.json app/prob_model.json kline/ kline_cloud/ kline_yuanta/ kline_futures/ amp_history.json lots_history.json bars_history.json
          if git diff --cached --quiet; then
            echo "沒有新資料,不 commit"; exit 0
          fi
          git commit -q -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 2026-11-22 使用者「全部做」(D6):原本 git pull --rebase; git push 沒有重試,和 taiex-1m(14:43,同一個
          #   kline_futures/TXF/<週>.csv)、recheck(pool.json)撞到就整次失敗、資料沒推上去。改成最多 6 次:
          #   fetch → rebase(衝突時「這次跑的版本優先」-X theirs)→
          #     · 這次整份重做的檔(pool*.json / pool.js / *_history.json / prob_model.json)直接用這次的結果蓋回去(不讓文字合併混進別人的行)
          #     · 台指期 kline_futures/TXF:遠端那份有變(taiex-1m 推了期交所完整 K)→ 以遠端為準,再用 save_fbars 只補遠端沒有的分鐘
          KEEP="$RUNNER_TEMP/keep"; mkdir -p "$KEEP"
          OWN="pool.js pool.json pool_prev.json pool_full.json app/prob_model.json amp_history.json lots_history.json bars_history.json"
          for f in $OWN; do [ -f "$f" ] && mkdir -p "$KEEP/$(dirname "$f")" && cp "$f" "$KEEP/$f"; done
          BASE=$(git rev-parse HEAD~1)
          for i in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && { echo "推送成功(第 $i 次)"; exit 0; }
            sleep $((i * 10))
            git fetch -q origin main || continue
            if ! git rebase -q origin/main; then
              git rebase --abort
              git rebase -q -X theirs origin/main || { git rebase --abort; echo "rebase 失敗,再試"; continue; }
            fi
            for f in $OWN; do [ -f "$KEEP/$f" ] && cp "$KEEP/$f" "$f"; done
            if ! git diff --quiet "$BASE" origin/main -- kline_futures; then
              for f in $(git diff --name-only "$BASE" origin/main -- kline_futures); do git show "origin/main:$f" > "$f" 2>/dev/null || true; done
              python -c "import save_cloud_bars as s; s.save_fbars('$D_TW')" || echo "台指期雲端 K 重補失敗(以遠端期交所那份為準)"
            fi
            git add $OWN kline_futures/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then git commit -q -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"; else git commit -q --amend --no-edit; fi
            fi
            BASE=$(git rev-parse origin/main)
          done
          echo "推送 6 次都失敗"; exit 1
