name: 每日台股資料(pool.js + 分K)

on:
  schedule:
    # cron 用 UTC,台灣 = UTC+8
    # 週一~週五 14:30 台灣時間(收盤 13:30 後一小時)
    - cron: "30 6 * * 1-5"
    # 備援:16:30 台灣時間再跑一次(第一次若剛好失敗,這次補上;資料會合併不會重複)
    - cron: "30 8 * * 1-5"
  workflow_dispatch:      # 也可以到 Actions 頁面手動按 Run workflow

permissions:
  contents: write         # 要能 commit 回 repo

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 產生 pool.js / pool.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python make_pool.py

      - name: 抓分K(Yahoo 1 分K,合併進 kline/)
        run: python fetch_kline.py

      - name: Commit 回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool.js pool.json kline/ amp_history.json
          if git diff --cached --quiet; then
            echo "沒有新資料,不 commit"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
