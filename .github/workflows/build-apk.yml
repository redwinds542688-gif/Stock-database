# 2026-10-24 編譯手機 App(APK):改了 android/ 的程式就自動編譯,成功才把 APK 和 version.json 放到 app/apk/,手機「更新 App」會抓到。
# 公開 repo 的 GitHub Actions 不計費;只在 android 程式有改時才跑(一次約 5 分鐘),不碰 Cloudflare / KV。
name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/java/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle.kts'
      - 'android/app/src/main/AndroidManifest.xml'
permissions:
  contents: write
concurrency: { group: build-apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: 編譯
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: 放到 app/apk 並推送
        run: |
          code=$(grep -oP 'versionCode = \K\d+' android/app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          note=$(grep -oP '^// note: \K.*' android/app/build.gradle.kts | head -1)
          cp android/app/build/outputs/apk/release/app-release.apk app/apk/MyshMonitor.apk
          python3 -c "import json,sys; json.dump({'versionCode':int(sys.argv[1]),'versionName':sys.argv[2],'note':sys.argv[3]}, open('app/apk/version.json','w'), ensure_ascii=False)" "$code" "$name" "$note"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/apk/MyshMonitor.apk app/apk/version.json
          git commit -m "APK $name ($code) 自動編譯" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
