name: 部署 twse-proxy 到 Cloudflare

# worker.js 或 wrangler.toml 合併到 main 就自動部署;也可以在 Actions 頁手動按 Run workflow。
# 需要兩個 repo secret(Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (Cloudflare 建立的 API Token,範本 "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID (Cloudflare Workers 總覽頁右側的 Account ID)
# Worker 上原本設定的 GH_TOKEN 密鑰不會被覆蓋。
# 選用 secret:YT_PUSH_KEY(元大中繼程式推 1 分 K 的金鑰;有設就每次部署時帶給 Worker,沒設就略過)
# 2026-10-28 18:01 換 YT_PUSH_KEY(舊金鑰外流過),推這行觸發重新部署

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4

      - name: 檢查 Account ID 格式(32 個 0-9a-f;不對就略過,讓 wrangler 自己從 Token 查帳號)
        env:
          AID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          AID="$(printf '%s' "$AID" | tr -d '[:space:]')"
          if printf '%s' "$AID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID=$AID" >> "$GITHUB_ENV"
            echo "Account ID 格式正確"
          else
            echo "::warning::CLOUDFLARE_ACCOUNT_ID 不是 32 位 0-9a-f(長度 ${#AID}),略過,改由 Token 自動查帳號"
          fi

      # 2026-10-19 通知紀錄存雲端:Worker 要一個 KV 命名空間(綁定名 LOGS)。沒有就建,有就沿用;把 id 接到 wrangler.toml 後再部署。
      # 建不起來(Token 沒有 Workers KV 權限)只警告不失敗,Worker 照常部署,只是 ?log= 會回 503。
      - name: 建立 / 綁定 KV 命名空間 LOGS(通知紀錄)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler >/dev/null 2>&1 || npm install -g wrangler
          LIST="$(wrangler kv namespace list 2>/dev/null || true)"
          ID="$(printf '%s' "$LIST" | python3 -c 'import sys,json; s=sys.stdin.read(); i=s.find("["); j=s.rfind("]"); a=json.loads(s[i:j+1]) if i>=0 and j>i else []; print(next((x.get("id","") for x in a if str(x.get("title","")).endswith("LOGS")), ""))' 2>/dev/null || true)"
          if [ -z "$ID" ]; then
            OUT="$(wrangler kv namespace create LOGS 2>&1 || true)"; echo "$OUT"
            ID="$(printf '%s' "$OUT" | grep -oE 'id"?[[:space:]]*[:=][[:space:]]*"[0-9a-f]{32}"' | grep -oE '[0-9a-f]{32}' | head -1)"
          fi
          if [ -z "$ID" ]; then echo "::warning::KV 命名空間建不起來,通知紀錄雲端功能先關閉(Worker ?log= 回 503);檢查 CLOUDFLARE_API_TOKEN 有沒有 Workers KV Storage:Edit 權限"; exit 0; fi
          printf '\n[[kv_namespaces]]\nbinding = "LOGS"\nid = "%s"\n' "$ID" >> wrangler.toml
          echo "KV LOGS id=$ID"; tail -4 wrangler.toml

      # 2026-11-12 21:00 使用者「都改」(Cloudflare 2 R2 / 3 D1 / 5 Workers AI):沒有就建、有就沿用,綁定接到 wrangler.toml。
      #   Token 沒權限建不起來 → 只警告、不綁,Worker 照常部署(每日備份那幾項顯示「沒有綁定」)
      - name: 建立 / 綁定 R2(stock-backup)、D1(stock-trades)、Workers AI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cp wrangler.toml wrangler.base.toml
          if wrangler r2 bucket list 2>/dev/null | grep -q "stock-backup" || wrangler r2 bucket create stock-backup 2>&1 | tee /tmp/r2.txt | grep -qiE "created|already"; then
            printf '\n[[r2_buckets]]\nbinding = "R2"\nbucket_name = "stock-backup"\n' >> wrangler.toml; echo "R2 綁定好"
          else echo "::warning::R2 建不起來(Token 要 Workers R2 Storage:Edit,且帳號要開通 R2)"; grep -v "^\s*$" /tmp/r2.txt 2>/dev/null | grep -iE "error|enable|code|✘|auth" | head -8; fi
          DID="$(wrangler d1 list --json 2>/dev/null | python3 -c 'import sys,json; a=json.load(sys.stdin); print(next((x.get("uuid","") for x in a if x.get("name")=="stock-trades"),""))' 2>/dev/null || true)"
          if [ -z "$DID" ]; then OUT="$(wrangler d1 create stock-trades 2>&1 || true)"; echo "$OUT" | tail -8
            DID="$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)"; fi
          if [ -n "$DID" ]; then printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "stock-trades"\ndatabase_id = "%s"\n' "$DID" >> wrangler.toml; echo "D1 綁定好 $DID"
          else echo "::warning::D1 建不起來(Token 要 D1:Edit)"; fi
          printf '\n[ai]\nbinding = "AI"\n' >> wrangler.toml
          # 2026-11-13 14:30 使用者「開始」(Cloudflare 第二輪 1 延遲紀錄):Analytics Engine(資料集第一次寫入會自己建)
          printf '\n[[analytics_engine_datasets]]\nbinding = "LAT"\ndataset = "stock_latency"\n' >> wrangler.toml
          tail -15 wrangler.toml

      # 2026-11-07 20:41 使用者同意「雲端程式更新失敗推通知」:先用 Node 以模組模式檢查語法(11/07 註解吃掉程式碼那次 node --check 沒抓到)
      - name: 檢查 worker.js 語法
        run: node --input-type=module --check < worker.js

      - name: 部署到 Cloudflare Workers
        id: dep
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      # 2026-11-12 21:00 加了 R2 / D1 / AI 綁定部署失敗(權限不夠)→ 拿掉這三個綁定再部署一次(核心功能不能因為加料停擺)
      - name: 部署失敗 → 不帶 R2 / D1 / AI 再試一次
        if: steps.dep.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::warning::帶 R2 / D1 / AI / Analytics Engine 綁定部署失敗,改用基本設定部署"
          python3 - <<'PY'
          s = open("wrangler.toml", encoding="utf-8").read()
          for tag in ("\n[[r2_buckets]]", "\n[[d1_databases]]", "\n[ai]", "\n[[analytics_engine_datasets]]"):
              i = s.find(tag)
              if i >= 0:
                  j = s.find("\n[", i + len(tag))
                  s = s[:i] + (s[j:] if j >= 0 else "\n")
          open("wrangler.toml", "w", encoding="utf-8").write(s)
          PY
          tail -12 wrangler.toml
          wrangler deploy

      # 2026-10-25 使用者「做」:元大中繼程式推 K 線(?ybars=push)要 Worker 密鑰 YT_PUSH_KEY;金鑰只放 GitHub Secrets,這裡帶給 Worker
      - name: 帶上 YT_PUSH_KEY 密鑰(GitHub Secrets 有設才做)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          K: ${{ secrets.YT_PUSH_KEY }}
        run: |
          if [ -z "$K" ]; then echo "沒有設 YT_PUSH_KEY,略過"; exit 0; fi
          printf '%s' "$K" | wrangler secret put YT_PUSH_KEY
          echo "YT_PUSH_KEY 已帶給 Worker"

      - name: 確認上線
        run: |
          sleep 5
          curl -sS "https://twse-proxy.redwinds542688.workers.dev/?gh=status"
          echo; curl -sS "https://twse-proxy.redwinds542688.workers.dev/?log=days"

      # 2026-11-07 20:41 更新失敗 → 用還在跑的舊版 Worker 推一則提醒到手機「今日監控紀錄」(會跳通知);11/07 15:03~19:30 失敗了 4 個多小時都沒人知道
      - name: 更新失敗通知手機
        if: failure()
        env:
          K: ${{ secrets.YT_PUSH_KEY }}
          MSG0: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$K" ]; then echo "沒有 YT_PUSH_KEY,沒辦法推手機"; exit 0; fi
          python3 - <<'PY'
          import json, os, datetime, urllib.request
          n = datetime.datetime.utcnow() + datetime.timedelta(hours=8); d = n.strftime("%Y-%m-%d"); t = n.strftime("%H:%M")
          body = (os.environ.get("MSG0") or "").splitlines()[0][:60] if os.environ.get("MSG0") else "手動部署"
          it = {"d": d, "t": t, "title": "⚠ 雲端程式更新失敗", "body": body + " · 舊版照常在跑,請叫 Claude 查", "kind": "pc", "key": f"deployfail|{d} {t}"}
          req = urllib.request.Request("https://twse-proxy.redwinds542688.workers.dev/?log=add", data=json.dumps(it).encode(), method="POST",
                                       headers={"Content-Type": "application/json", "X-Push-Key": os.environ["K"], "User-Agent": "deploy-worker/1"})
          try: print(urllib.request.urlopen(req, timeout=15).read()[:200])
          except Exception as e: print("推不上", e)
          PY
