name: 部署 twse-proxy 到 Cloudflare

# worker.js 或 wrangler.toml 合併到 main 就自動部署;也可以在 Actions 頁手動按 Run workflow。
# 需要兩個 repo secret(Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (Cloudflare 建立的 API Token,範本 "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID (Cloudflare Workers 總覽頁右側的 Account ID)
# Worker 上原本設定的 GH_TOKEN 密鑰不會被覆蓋。

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4

      - name: 檢查 Account ID 格式(32 個 0-9a-f;不對就略過,讓 wrangler 自己從 Token 查帳號)
        env:
          AID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          AID="$(printf '%s' "$AID" | tr -d '[:space:]')"
          if printf '%s' "$AID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID=$AID" >> "$GITHUB_ENV"
            echo "Account ID 格式正確"
          else
            echo "::warning::CLOUDFLARE_ACCOUNT_ID 不是 32 位 0-9a-f(長度 ${#AID}),略過,改由 Token 自動查帳號"
          fi

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: 確認上線
        run: |
          sleep 5
          curl -sS "https://twse-proxy.redwinds542688.workers.dev/?gh=status"
