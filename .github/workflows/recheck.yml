name: 開盤前資格複檢

on:
  schedule:
    - cron: "45 0 * * 1-5"
    - cron: "5 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python recheck.py
      - name: Commit 回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool.js pool.json
          if git diff --cached --quiet; then
            echo "沒有變動,不 commit"
          else
            git commit -m "資格複檢 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
