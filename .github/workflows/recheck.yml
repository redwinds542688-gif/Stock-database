name: 開盤前資格複檢

on:
  schedule:
    # cron 用 UTC,台灣 = UTC+8
    # 週一~週五 08:45 台灣時間:證交所 / 櫃買已公布今天的可當沖名單
    # GitHub 排程常延遲 1~5 小時(10/16 的 08:45、09:05 兩次都沒在開盤前跑到),所以多排幾個時段;
    # recheck.py 名單已是今天的就不會重複改,多跑沒副作用
    - cron: "20 0 * * 1-5"
    - cron: "35 0 * * 1-5"
    - cron: "45 0 * * 1-5"
    # 09:05 / 09:20 / 09:40 再試(08:45 若名單還是昨天的,這幾次補上)
    - cron: "5 1 * * 1-5"
    - cron: "20 1 * * 1-5"
    - cron: "40 1 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "今天已複檢過也強制再做一次(1 = 是)"
        default: "0"

permissions:
  contents: write

# 2026-11-22 使用者「全部做」(D6):原本和 daily 共用 group: daily,排隊中的 run 會被同組新排進來的靜靜取消
#   (延遲的 recheck 會把 14:30 daily 擠掉)。改成自己一組;同組內較新的 recheck 取代排隊中的舊 recheck 沒關係(本來就是重試)
concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 用今天的官方名單複檢資格
        run: python recheck.py
        env:
          FORCE: ${{ github.event.inputs.force || '0' }}

      - name: Commit 回 repo
        env:
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool.js pool.json
          if git diff --cached --quiet; then
            echo "沒有變動,不 commit"; exit 0
          fi
          git commit -q -m "資格複檢 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 2026-11-22 使用者「全部做」(D6):原本 git pull --rebase; git push 不重試。改成最多 5 次:
          #   遠端的 pool.json / pool.js 沒變 → 一般 rebase 再推;
          #   遠端的 pool.json 變了(daily 換了新名單 / 另一次複檢先推了)→ 不拿舊名單的修改去硬合併,
          #   丟掉這次的 commit、在遠端最新的 pool.json 上重跑一次 recheck.py 再推(今天已複檢過的話 recheck.py 會直接結束,沒東西可推)
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && { echo "推送成功(第 $i 次)"; exit 0; }
            sleep $((i * 10))
            git fetch -q origin main || continue
            if git diff --quiet HEAD~1 origin/main -- pool.json pool.js; then
              git rebase -q origin/main || { git rebase --abort; continue; }
            else
              echo "遠端 pool.json 已更新 → 在最新的名單上重跑複檢"
              git reset -q --hard origin/main
              python recheck.py
              git add pool.js pool.json
              git diff --cached --quiet && { echo "重跑後沒有變動"; exit 0; }
              git commit -q -m "資格複檢 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            fi
          done
          echo "推送 5 次都失敗"; exit 1
