name: 加權指數 / 台指期 1 分 K(每天收盤後存)

# 2026-11-13 19:45 使用者「好」:每天存加權指數 1 分 K(證交所每 5 秒指數合成),之後用加權指數算 r(順大盤)重測
on:
  workflow_dispatch:
    inputs:
      from: { description: 補資料起日 YYYY-MM-DD(不填 = 今天), required: false, default: '' }
      to:   { description: 補資料迄日, required: false, default: '' }
  schedule:
    - cron: '43 6 * * 1-5'   # UTC 06:43 = 台北 14:43(週一 ~ 五)

permissions:
  contents: write

concurrency: { group: taiex-1m, cancel-in-progress: false }

jobs:
  taiex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # 2026-11-21 使用者「全改」(檢查 W6):帶中繼金鑰(GitHub Secrets 的 YT_PUSH_KEY,只放環境變數、不印出來)→ Worker 的 ?twidx / ?taifex 不受「沒鑰匙每個 IP 10 分鐘 20 次」限制;
      #   程式遇到 429 / 5xx 會等一下再試,還是有哪天失敗就結束碼 1(這個工作變紅)。兩個抓的步驟有一個失敗,另一個和「存檔」照樣跑(抓到的先存)
      #   起訖日改用環境變數傳(不直接塞進指令)
      - name: 抓證交所每 5 秒指數 → 1 分 K
        env:
          YT_PUSH_KEY: ${{ secrets.YT_PUSH_KEY }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: python3 tools/taiex_1m.py "$FROM" "$TO"
      - name: 台指期每筆成交 → 1 分 K(2026-11-13 20:00 使用者「台指期 略有參考價值 如何取得」;期交所 14:30 後公布)
        if: ${{ !cancelled() }}
        env:
          YT_PUSH_KEY: ${{ secrets.YT_PUSH_KEY }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: python3 tools/txf_1m.py "$FROM" "$TO"
      - name: 存檔
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          for d in kline_index kline_futures; do [ -d $d ] && git add $d; done
          git diff --cached --quiet && exit 0
          git commit -m "加權指數 / 台指期 1 分 K"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
