name: 盤中進場訊息存檔

# 2026-11-03 使用者「那就放在開放的空間」:收盤後把當天盤中發過的進場訊息(只有 代號|多空|判別式)存到 live_entries.json,
#   事後重算的虛擬交易(額度版)對照用。金鑰 YT_PUSH_KEY 只在這裡從 GitHub Secrets 帶給程式,不印出來
on:
  schedule:
    # 台灣 14:05 / 16:05 / 20:05(GitHub 排程常延遲,多排幾次;同一天重抓沒副作用)
    - cron: "5 6 * * 1-5"
    - cron: "5 8 * * 1-5"
    - cron: "5 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:   # 2026-11-22 使用者「全部做」(D6):原本 group: daily,排隊中的 daily / recheck 會被它擠掉;只寫 live_entries.json,自己一組
  group: live-entries
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4
      - name: 存盤中進場訊息
        run: python3 tools/live_entries.py
        env:
          YT_PUSH_KEY: ${{ secrets.YT_PUSH_KEY }}
      - name: Commit 回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_entries.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "沒有變動,不 commit"; exit 0
          fi
          git commit -m "盤中進場訊息存檔 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 2026-11-22 使用者「全部做」(D6):推送失敗重試(fetch → rebase,衝突以這次為準),最多 5 次
          for i in $(seq 1 5); do
            git push -q origin HEAD:main && exit 0
            sleep $((i * 10)); git fetch -q origin main || continue
            git rebase -q origin/main || { git rebase --abort; git rebase -q -X theirs origin/main || git rebase --abort; }
          done
          echo "推送 5 次都失敗"; exit 1
