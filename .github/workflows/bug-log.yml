name: 抓 bug 紀錄 / 用量存檔

# 2026-11-21 使用者「全改」(檢查 W5):?bug=list / ?bug=get / ?usage=get 改成要中繼金鑰或 owner 鑰匙後,雲端的 Claude 沒有鑰匙讀不到 →
#   每個交易日收盤後(和手動按 Run workflow)用 GitHub Secrets 的 YT_PUSH_KEY(只放環境變數,不印出來、不寫進檔案)讀回來,存到這個私人庫的 bugs/:
#     bugs/list.json        ?bug=list(全部的鍵和大小)
#     bugs/bug_<時間>.json  最新 N 份 ?bug=get 的內容(舊的刪掉,只留 N 份;內容裡像鑰匙的字串先遮掉)
#     bugs/pbug.json        ?pbug=list(夥伴看盤 / 夥伴加入的錯誤,最近 300 筆)
#     bugs/usage.json       ?usage=get 今天和前一天的請求次數
#   bugs/ 不在 Worker 的 GH_PUBLIC 白名單,不用鑰匙讀不到
on:
  workflow_dispatch:
    inputs:
      n: { description: 留幾份 bug 紀錄(最新的), required: false, default: '8' }
  schedule:
    - cron: '47 6 * * 1-5'   # UTC 06:47 = 台北 14:47(週一 ~ 五,收盤後)

permissions:
  contents: write

concurrency: { group: bug-log, cancel-in-progress: false }

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 讀 bug 紀錄 / 用量
        env:
          K: ${{ secrets.YT_PUSH_KEY }}
          N: ${{ inputs.n }}
        run: |
          python3 - <<'PY'
          import os, re, sys, json, datetime, urllib.request, urllib.error
          from pathlib import Path
          K = os.environ.get("K", "")
          if not K: print("GitHub Secrets 沒有 YT_PUSH_KEY"); sys.exit(1)
          B = "https://twse-proxy.redwinds542688.workers.dev/"
          H = {"X-Push-Key": K, "User-Agent": "bug-log/1"}
          N = max(1, min(30, int(os.environ.get("N") or 8)))
          # 2026-11-21 使用者「改 A」(A3):原本對整段原始文字套規則 → 純數字(0.6666666666666666、時間戳)被當鑰匙、巢狀 JSON 的 \" 反斜線被吃掉 → 存下來的檔不是合法 JSON。
          #   改成和 Worker 的 scrubText / scrubKeys 一樣:scrub_text 只遮真的像鑰匙的(fa11…;20~64 碼十六進位且同時有 a-f 字母和數字;github_pat_ / ghp_;Bearer;X-Push-Key;
          #   k= / dv= / key= / pass= / pwd= / token= 的值遇到引號、反斜線、&、空白就停);scrub_json:解析成 JSON 後只遮字串值(欄位名稱不動)再存回去,不是 JSON 才用文字版
          def scrub_text(t):   # 和 Worker 的 scrubText 一樣,再加上金鑰本身
              t = str(t).replace(K, "[鑰匙]")
              t = re.sub(r"fa11[0-9a-f]{6,}", "[鑰匙]", t, flags=re.I)
              t = re.sub(r"(?<![0-9a-z])(?=[0-9a-f]*[a-f])(?=[0-9a-f]*[0-9])[0-9a-f]{20,64}(?![0-9a-z])", "[鑰匙]", t, flags=re.I)
              t = re.sub(r"\b(github_pat_|gh[pousr]_)[A-Za-z0-9_]{20,}", r"\1[鑰匙]", t)
              t = re.sub(r"\b(Bearer\s+)[A-Za-z0-9._~+/=-]{16,}", r"\1[鑰匙]", t, flags=re.I)
              t = re.sub(r"(X-Push-Key[\"']?\s*[:=]\s*[\"']?)[^\s\"'\\,&;}]+", r"\1*", t, flags=re.I)
              return re.sub(r"((?:^|[?&\s;,(])(k|dv|key|pass|pwd|token)=)[^&\s\"'\\<>#]+", r"\1*", t, flags=re.I)
          SCRUB_FIELD = re.compile(r"^(pass|pwd|password|token|secret|authorization|x-push-key)$", re.I)
          def scrub_val(v):
              if isinstance(v, str): return scrub_text(v)
              if isinstance(v, list): return [scrub_val(x) for x in v]
              if isinstance(v, dict): return {k: ("*" if SCRUB_FIELD.match(k) and isinstance(x, str) and x else scrub_val(x)) for k, x in v.items()}
              return v
          def scrub_json(v, indent=None):   # v = 已解析的物件,或原始文字(能解析就當 JSON)
              if isinstance(v, str):
                  try: v = json.loads(v)
                  except Exception: return scrub_text(v)
              try: return json.dumps(scrub_val(v), ensure_ascii=False, indent=indent)
              except RecursionError: return scrub_text(json.dumps(v, ensure_ascii=False))
          scrub = scrub_text
          def get(q, key=True):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(B + q, headers=H if key else {"User-Agent": "bug-log/1"}), timeout=60)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:200]
          D = Path("bugs"); D.mkdir(exist_ok=True); bad = 0
          s, t = get("?bug=list")
          if s != 200: print("bug=list", s, scrub(t)); sys.exit(1)
          L = json.loads(t); (D / "list.json").write_text(scrub_json(L, 1), encoding="utf-8")
          keys = sorted({x["k"] for x in L if str(x.get("k", "")).startswith("bug:")}, reverse=True)[:N]
          keep = set()
          for k in keys:
              f = D / ("bug_" + re.sub(r"[^\w]", "_", k[4:]) + ".json"); keep.add(f.name)
              s, t = get("?bug=get&bk=" + urllib.request.quote(k))
              if s != 200: print("bug=get", k, s, scrub(t)); bad += 1; continue
              f.write_text(scrub_json(t), encoding="utf-8"); print("bug", k, len(t), "字")
          for f in D.glob("bug_*.json"):
              if f.name not in keep: f.unlink()
          s, t = get("?pbug=list&n=300", key=False)
          if s == 200: (D / "pbug.json").write_text(scrub_json(t), encoding="utf-8")
          else: print("pbug=list", s, scrub(t)); bad += 1
          tw = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))); U = {}
          for d in (tw.date(), tw.date() - datetime.timedelta(days=1)):
              s, t = get("?usage=get&d=" + d.isoformat())
              if s == 200: U[d.isoformat()] = json.loads(t)
              else: print("usage=get", d, s, scrub(t)); bad += 1
          (D / "usage.json").write_text(scrub_json(U, 1), encoding="utf-8")
          print("完成:bug 紀錄", len(keep), "份" + (f"(有 {bad} 項失敗)" if bad else ""))
          sys.exit(1 if bad else 0)
          PY
      - name: 存檔
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          [ -d bugs ] || exit 0
          git add -A bugs
          git diff --cached --quiet && { echo "沒有變動"; exit 0; }
          git commit -q -m "抓 bug 紀錄 / 用量存檔 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 2026-11-22 使用者「全部做」(D6):pull --rebase 衝突會卡在 rebase 中、後面重試全失敗 → 衝突先 abort 再以這次為準(-X theirs)重新 rebase
          for i in $(seq 1 5); do
            git push -q origin HEAD:main && exit 0
            sleep $((i * 10)); git fetch -q origin main || continue
            git rebase -q origin/main || { git rebase --abort; git rebase -q -X theirs origin/main || git rebase --abort; }
          done
          echo "推送 5 次都失敗"; exit 1
