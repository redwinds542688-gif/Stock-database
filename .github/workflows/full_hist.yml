name: 元大歷史抓滿名單(一次性)

# 2026-10-25 使用者「符合條件一律收進來…預先抓好抓滿」:用證交所 / 櫃買盤後行情 + amp_history.json,
# 把每個交易日「前一天收盤符合選股條件的全部股票」併進 tools/yuanta_bridge/hist_list.json(桌機 hist_kline.py 照這份抓)。
# 只在這支腳本改動或手動按時跑,一次約 1~2 分鐘。
on:
  push:
    branches: [main]
    paths: [tools/yuanta_bridge/build_full_hist.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:   # 2026-11-22 使用者「全部做」(D6):原本 group: daily,會擠掉排隊中的 daily;只寫 hist_list.json,自己一組
  group: full-hist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tools/yuanta_bridge/build_full_hist.py
      - name: Commit 回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/yuanta_bridge/hist_list.json
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "元大歷史抓滿名單 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 2026-11-22 使用者「全部做」(D6):推送失敗重試(fetch → rebase,衝突以這次為準),最多 5 次
          for i in $(seq 1 5); do
            git push -q origin HEAD:main && exit 0
            sleep $((i * 10)); git fetch -q origin main || continue
            git rebase -q origin/main || { git rebase --abort; git rebase -q -X theirs origin/main || git rebase --abort; }
          done
          echo "推送 5 次都失敗"; exit 1
