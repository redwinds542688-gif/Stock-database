name: 查 Cloudflare Worker 用量(只讀)

# 2026-11-12 14:57 使用者「進程式 太慢 看 bug」:Worker 回 429 / error 1027(免費方案一天 10 萬次請求用完)。
# 2026-11-12 20:45 使用者「明天之後 把一天使用量算出來」:每天台北 00:07 自動跑,算前一天(台北日界)的
#   Worker 請求數 + Durable Object 請求數,寫進 app/cf_usage.json 和 Cloudflare用量.md。
#   用 GraphQL Analytics 查(不打 Worker、不吃額度)。CLOUDFLARE_ACCOUNT_ID 沒設 → 用 token 問 /accounts 拿。
on:
  workflow_dispatch:
    inputs:
      today: { description: 也印今天到目前(每小時), required: false, default: 'no' }
  schedule:
    - cron: '7 16 * * *'   # UTC 16:07 = 台北 00:07

permissions:
  contents: write

concurrency: { group: cf-usage, cancel-in-progress: false }

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 查每天請求數
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TODAY: ${{ inputs.today }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, datetime as dt
          from pathlib import Path
          T = os.environ["TOKEN"].strip(); A = "".join((os.environ.get("AID") or "").split())
          H = {"Authorization": "Bearer " + T, "Content-Type": "application/json"}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30))
          if not A:
              try: A = get("https://api.cloudflare.com/client/v4/accounts?per_page=5")["result"][0]["id"]
              except Exception as e: print("拿不到帳號編號", e); raise SystemExit(0)
          now = dt.datetime.now(dt.timezone.utc).replace(tzinfo=None)
          since = (now - dt.timedelta(hours=80)).strftime("%Y-%m-%dT%H:00:00Z"); until = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          def gql(q):
              r = json.load(urllib.request.urlopen(urllib.request.Request("https://api.cloudflare.com/client/v4/graphql",
                    data=json.dumps({"query": q, "variables": {"a": A, "s": since, "u": until}}).encode(), headers=H), timeout=30))
              if r.get("errors"): print("錯誤", json.dumps(r["errors"], ensure_ascii=False)[:600])
              return ((r.get("data") or {}).get("viewer") or {}).get("accounts") or [{}]
          tw = lambda s: (dt.datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ") + dt.timedelta(hours=8))
          W = {}; E = {}; HR = {}
          for x in gql("""query($a:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){
              w:workersInvocationsAdaptive(limit:2000,filter:{datetime_geq:$s,datetime_leq:$u}){sum{requests errors}dimensions{datetimeHour}}}}}""")[0].get("w") or []:
              t = tw(x["dimensions"]["datetimeHour"]); d = t.strftime("%Y-%m-%d")
              W[d] = W.get(d, 0) + x["sum"]["requests"]; E[d] = E.get(d, 0) + x["sum"]["errors"]
              k = (d, t.hour); HR[k] = HR.get(k, 0) + x["sum"]["requests"]
          D = {}
          try:
              for x in gql("""query($a:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){
                  o:durableObjectsInvocationsAdaptiveGroups(limit:2000,filter:{datetime_geq:$s,datetime_leq:$u}){sum{requests}dimensions{datetimeHour}}}}}""")[0].get("o") or []:
                  d = tw(x["dimensions"]["datetimeHour"]).strftime("%Y-%m-%d"); D[d] = D.get(d, 0) + x["sum"]["requests"]
          except Exception as e: print("DO 查詢失敗", e)
          today = (now + dt.timedelta(hours=8)).strftime("%Y-%m-%d")
          if os.environ.get("TODAY") == "yes":   # 2026-11-13 12:02 使用者「檢查 cloudflare 使用量」:印今天到目前(不存檔)
              tw_ = sorted((h, n) for (dd, h), n in HR.items() if dd == today)
              print(f"今天 {today} 到目前:Worker {W.get(today, 0):,} 次、錯誤 {E.get(today, 0):,}、DO {D.get(today, 0) or 0:,} 次")
              print("每小時:" + "、".join(f"{h:02d}時 {n:,}" for h, n in tw_))
          p = Path("app/cf_usage.json")
          try: J = json.loads(p.read_text(encoding="utf-8"))
          except Exception: J = {}
          for d in sorted(W):
              if d >= today: continue   # 今天還沒過完不記
              if d <= (dt.datetime.strptime(since, "%Y-%m-%dT%H:00:00Z") + dt.timedelta(hours=8)).strftime("%Y-%m-%d"): continue   # 2026-11-14 00:45 查詢範圍的第一天不完整(80 小時前開始),不蓋掉舊紀錄(11/10 被蓋成半天)
              busy = sorted(((h, n) for (dd, h), n in HR.items() if dd == d), key=lambda z: -z[1])[:3]
              J[d] = {"worker": W[d], "errors": E.get(d, 0), "do": D.get(d), "top_hours": [f"{h:02d}時 {n:,}" for h, n in busy]}
          p.write_text(json.dumps(dict(sorted(J.items())), ensure_ascii=False, indent=1), encoding="utf-8")
          mon = {}
          for d, v in J.items(): m = mon.setdefault(d[:7], [0, 0]); m[0] += v["worker"]; m[1] += v.get("do") or 0
          L = ["# Cloudflare 每天用量(台北日界,每天 00:07 自動更新)", "",
               "額度(Workers Paid,每月):Worker 請求 1,000 萬次;Durable Object 請求 100 萬次(超過 Worker 每 100 萬次 0.30 美元、DO 每 100 萬次 0.15 美元)", "",
               "| 日期 | Worker 請求 | 錯誤 | Durable Object 請求 | 最忙的時段 |", "|---|---|---|---|---|"]
          for d, v in sorted(J.items(), reverse=True)[:60]:
              L.append(f"| {d} | {v['worker']:,} | {v['errors']:,} | {'' if v.get('do') is None else format(v['do'], ',')} | {'、'.join(v.get('top_hours') or [])} |")
          L += ["", "| 月份 | Worker 合計 | 用掉額度 | DO 合計 | 用掉額度 |", "|---|---|---|---|---|"]
          for m, (w, o) in sorted(mon.items(), reverse=True):
              L.append(f"| {m} | {w:,} | {w/1e7*100:.1f}% | {o:,} | {o/1e6*100:.1f}% |")
          Path("Cloudflare用量.md").write_text("\n".join(L) + "\n", encoding="utf-8")
          print("\n".join(L))
          PY
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add app/cf_usage.json Cloudflare用量.md
          git diff --cached --quiet && exit 0
          git commit -m "Cloudflare 每天用量"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
