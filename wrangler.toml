# twse-proxy 的部署設定(給 GitHub Actions 的 deploy-worker.yml 用)
# 以後要改 Worker 程式碼或排程,只要改 worker.js / 這個檔,合併到 main 就會自動部署到 Cloudflare。
name = "twse-proxy"
main = "worker.js"
compatibility_date = "2024-09-01"

# Cloudflare 免費方案全帳號最多 5 條 cron;這裡只用 1 條,scheduled() 自己判斷台灣時段
# (08:20/08:45/09:05 複檢,14:30/16:30/20:30 每日資料)。UTC 0-1 點 = 台灣 8-9 點,UTC 6-12 點 = 台灣 14-20 點。
[triggers]
crons = ["*/5 0-1,6-12 * * MON-FRI"]
