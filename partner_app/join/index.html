<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夥伴加入</title>
<meta name="theme-color" content="#0B0E14">
<link rel="manifest" href="/partner/join/manifest.webmanifest">
<link rel="icon" type="image/png" href="/partner/join/icon-192.png">
<link rel="apple-touch-icon" href="/partner/join/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="夥伴加入">
<!-- 2026-11-15 使用者「換 新增夥伴那個 … 現在要做的是 自動當沖夥伴加入 這又是另外一個程式 是連結主程式給看盤版的橋樑」
     使用者確認流程:主導$ 新增夥伴 → 夥伴用自己手機填元大帳號 / 電子密碼 / 憑證(加密送到主導$ 電腦,不經雲端存放)
     → 主導$ 設額度與公式 → 電腦多開一份主程式用夥伴帳號自動當沖 → 產生 fa11 金鑰 QR → 夥伴用「夥伴看盤」掃描。
     這一版只是畫面(範例資料):不連雲端、不連電腦、不會下單、不會送出任何資料。 -->
<style>
:root{
  --u:calc(100vw / 30);--uf:min(calc(100vw / 30), calc(62vh / 30));
  --ground:#05070B;--bg:#0B0E14;--card:#151B28;--card2:#111827;--line:#2A3244;--line2:#3A4357;
  --fg:#E6EAF2;--sub:#8C96AB;--soft:#C9D1DF;--gold:#FFD54F;--green:#22E06B;--blue:#29B6F6;--up:#FF4D5E;--down:#2EE59D;--bad:#FF3B3B;
  --f:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;color-scheme:dark}
*{box-sizing:border-box} html,body{height:100%;margin:0;overscroll-behavior:none;max-width:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* 手機「字型大小」調大時,瀏覽器 / 預覽不要自己把字放大(會撐破版面、可以左右滑) */   /* 21:26 使用者手機截圖「左滑」:標題太寬撐出畫面 → 可以左右滑;整頁不准橫向捲 */
body{background:var(--ground);color:var(--fg);font-family:var(--f)}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.pv{display:flex;gap:calc(var(--u) * .4);align-items:center;padding:calc(var(--uf) * .45) calc(var(--u) * .6);background:#0E121A;border-bottom:1px dashed var(--line2);font-size:calc(var(--uf) * .85);color:var(--sub)}
.pv b{color:var(--gold);margin-left:auto;white-space:nowrap} .pv > span{white-space:nowrap}
.who{display:flex;gap:calc(var(--u) * .3);min-width:0} .who button{white-space:nowrap;height:calc(var(--uf) * 2.2);padding:0 calc(var(--uf) * .7);border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--soft);font-size:calc(var(--uf) * .9);cursor:pointer}
.who button.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.ttl{padding:calc(var(--uf) * .7) calc(var(--u) * .6);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:calc(var(--uf) * .6)}
.ttl h1{margin:0;min-width:0;overflow:hidden;font-size:calc(var(--uf) * 1.75);font-weight:900;white-space:nowrap;background:linear-gradient(90deg,#FF5A5F,#FFB13B 30%,#3DDC84 60%,#29B6F6 80%,#B15CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{flex:none;margin-left:auto;font-size:calc(var(--uf) * .9);color:var(--gold);border:1px solid #8A7320;border-radius:6px;padding:0 calc(var(--uf) * .45);white-space:nowrap}
main{flex:1;min-height:0;overflow-y:auto;padding:calc(var(--uf) * .8) calc(var(--u) * .6);display:flex;flex-direction:column;gap:calc(var(--uf) * .8);scrollbar-width:none}
main::-webkit-scrollbar{display:none}
h2{margin:0;font-size:calc(var(--uf) * 1.5);font-weight:900;color:var(--gold)}
.hint{margin:0;font-size:calc(var(--uf) * .95);color:var(--sub);line-height:1.6}
.card{background:var(--card);border-radius:12px;padding:calc(var(--uf) * .9) calc(var(--u) * .6);display:flex;flex-direction:column;gap:calc(var(--uf) * .6)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:calc(var(--uf) * .3) calc(var(--u) * .4);align-items:center;background:var(--card);border-radius:12px;padding:calc(var(--uf) * .8) calc(var(--u) * .6);cursor:pointer;border:1px solid transparent}
.prow:hover{border-color:var(--line2)}
.prow b{font-size:calc(var(--uf) * 1.4)} .prow small{grid-column:1 / -1;font-size:calc(var(--uf) * .9);color:var(--sub)}
.st{font-size:calc(var(--uf) * .95);font-weight:700;border:1px solid;border-radius:999px;padding:calc(var(--uf) * .1) calc(var(--uf) * .6);white-space:nowrap}
.st.wait{color:var(--gold);border-color:#8A7320} .st.run{color:var(--green);border-color:var(--green)} .st.pc{color:var(--blue);border-color:var(--blue)} .st.off{color:var(--sub);border-color:var(--line2)} .st.err{color:var(--bad);border-color:var(--bad)}
.btn{height:calc(var(--uf) * 3.6);border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--soft);font-size:calc(var(--uf) * 1.4);font-weight:900;cursor:pointer;width:100%}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#000} .btn.green{background:var(--green);border-color:var(--green);color:#000} .btn.blue{border-color:var(--blue);color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u) * .4)}
label{display:flex;flex-direction:column;gap:calc(var(--uf) * .3);font-size:calc(var(--uf) * 1);color:var(--soft)}
label small{color:var(--sub);font-size:calc(var(--uf) * .85)}
input[type=text],input[type=password],input[type=number]{height:calc(var(--uf) * 3.2);border-radius:10px;border:1px solid var(--line2);background:#0B0E14;color:var(--fg);font-size:calc(var(--uf) * 1.3);padding:0 calc(var(--uf) * .8);width:100%}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:calc(var(--u) * .3)} .unit span{font-size:calc(var(--uf) * 1.1);color:var(--sub)}
.file{display:flex;align-items:center;gap:calc(var(--u) * .4);height:calc(var(--uf) * 3.2);border-radius:10px;border:1px dashed var(--blue);padding:0 calc(var(--uf) * .8);color:var(--blue);font-size:calc(var(--uf) * 1.1);cursor:pointer}
.file.ok{border-style:solid;border-color:var(--green);color:var(--green)}
.ck{flex-direction:row;align-items:center;gap:calc(var(--uf) * .6);font-size:calc(var(--uf) * 1.05);color:var(--fg)} .ck input{width:calc(var(--uf) * 1.4);height:calc(var(--uf) * 1.4);accent-color:var(--green);flex:none}
.lock{display:flex;gap:calc(var(--uf) * .5);align-items:flex-start;font-size:calc(var(--uf) * .9);color:#B8E8C8;background:#0E1A12;border:1px solid #1F5A33;border-radius:10px;padding:calc(var(--uf) * .6) calc(var(--uf) * .8);line-height:1.6}
.qr{align-self:center;width:calc(var(--uf) * 13);height:calc(var(--uf) * 13);background:#fff;border-radius:12px;padding:calc(var(--uf) * .7)}
.qr svg{width:100%;height:100%;display:block}
.code{align-self:center;font:700 calc(var(--uf) * 1.2) ui-monospace,monospace;letter-spacing:1px;color:var(--soft)}
.steps{display:flex;flex-direction:column;gap:calc(var(--uf) * .5)}
.step{display:flex;align-items:center;gap:calc(var(--uf) * .7);font-size:calc(var(--uf) * 1.15)}
.step i{flex:none;width:calc(var(--uf) * 1.8);height:calc(var(--uf) * 1.8);border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:calc(var(--uf) * 1);font-weight:900;border:2px solid var(--line2);color:var(--sub)}
.step.done i{background:var(--green);border-color:var(--green);color:#000} .step.now i{border-color:var(--gold);color:var(--gold)} .step.now{color:var(--gold);font-weight:700} .step.todo{color:var(--sub)}
.jg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u) * .3)}
.jg button{height:calc(var(--uf) * 3);border-radius:10px;border:2px solid var(--line2);background:#000;color:var(--sub);font-size:calc(var(--uf) * 1.25);font-weight:900;cursor:pointer}
.jg button.on{border-color:var(--green);color:var(--green);background:#0E1A12}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:calc(var(--uf) * 1.2);font-weight:700}
.tg{width:calc(var(--uf) * 4);height:calc(var(--uf) * 2.2);border-radius:999px;border:0;background:#3A4357;position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:calc(var(--uf) * .25);left:calc(var(--uf) * .25);width:calc(var(--uf) * 1.7);height:calc(var(--uf) * 1.7);border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--green)} .tg.on::after{left:calc(var(--uf) * 2.05)}
.back{align-self:flex-start;background:none;border:0;color:var(--blue);font-size:calc(var(--uf) * 1.05);cursor:pointer;padding:0}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--uf) * .35) calc(var(--u) * .5);font-size:calc(var(--uf) * 1.05)} .sum span{color:var(--sub)} .sum b{text-align:right}
.ok-big{align-self:center;font-size:calc(var(--uf) * 3)}
.verl{white-space:nowrap;font-size:calc(var(--uf) * .75);color:var(--sub)}
.zero{align-items:center;text-align:center;padding-top:calc(var(--uf) * 1.6);padding-bottom:calc(var(--uf) * 1.4)} .zero > b{font-size:calc(var(--uf) * 1.5)} .zi{font-size:calc(var(--uf) * 3.2);line-height:1} .zero .steps{align-self:stretch;text-align:left}
.pmask{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:20;padding:calc(var(--uf) * 1.2)} .pbox{background:var(--card);border-radius:14px;padding:calc(var(--uf) * 1);display:flex;flex-direction:column;gap:calc(var(--uf) * .7);max-width:92vw;max-height:92vh} .pbox img{max-width:100%;max-height:62vh;object-fit:contain;border-radius:10px} .pbox b{color:var(--green);font-size:calc(var(--uf) * 1.3);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--uf) * 2);background:#0E1A12;border:1px solid var(--green);color:#C9FFE5;padding:calc(var(--uf) * .6) calc(var(--uf) * 1);border-radius:10px;font-size:calc(var(--uf) * 1);z-index:9;max-width:90vw}
@media (prefers-reduced-motion:reduce){.tg::after{transition:none}}
.qbox{align-self:center;width:calc(var(--uf) * 15);height:calc(var(--uf) * 15);background:#fff;border-radius:14px;padding:calc(var(--uf) * .8)} .qbox svg{width:100%;height:100%;display:block}
.use{display:flex;flex-direction:column;gap:calc(var(--uf) * .55)} .use div{display:flex;gap:calc(var(--uf) * .6);align-items:flex-start;font-size:calc(var(--uf) * 1.02);line-height:1.5}
.use i{flex:none;font-style:normal;font-weight:900;border-radius:6px;padding:0 calc(var(--uf) * .45);font-size:calc(var(--uf) * .9)} .use .m{background:#2A1416;color:#FF8A8A;border:1px solid #7A2A2E} .use .v{background:#0B1A26;color:var(--blue);border:1px solid #1E5A7A}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(var(--uf) * 1.4);z-index:30}
.opt{flex-direction:row;align-items:flex-start;gap:calc(var(--uf) * .6);padding:calc(var(--uf) * .6);border:1px solid var(--line2);border-radius:10px;cursor:pointer}
.opt.on{border-color:var(--green);background:#0E1A12} .opt input{accent-color:var(--green);width:calc(var(--uf) * 1.3);height:calc(var(--uf) * 1.3);margin-top:.2em;flex:none}
.opt span{display:flex;flex-direction:column;gap:2px} .opt b{color:var(--fg);font-size:calc(var(--uf) * 1.1)} .opt small{color:var(--sub);font-size:calc(var(--uf) * .9)}
.lt{width:100%;border-collapse:collapse;font-size:calc(var(--uf) * 1.05);font-variant-numeric:tabular-nums} .lt th,.lt td{padding:calc(var(--uf) * .35);text-align:center;border-bottom:1px solid var(--line)} .lt th{color:var(--sub);font-weight:500} .lt td:first-child{text-align:left;color:var(--soft)}
.mask{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.verl{white-space:nowrap;font-size:calc(var(--uf) * .75);color:var(--sub)}
.gate .card{width:100%;max-width:420px;border:2px solid var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="pv"><span>範例資料(還沒連電腦)</span><b></b><span class="verl" id="ver"></span></div>
  <header class="ttl"><h1>自動當沖 · 夥伴加入</h1><span class="tag">主導$</span></header>
  <main id="main"></main>
</div>
<div id="toastL"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
/* 2026-11-16 23:00 使用者重訂方向:① 只有主導$ 能用 ② 新增夥伴:元大帳號 / 密碼由主導$ 輸入,憑證由主導$ 申請裝進自己電腦
   ③ 完成後自動產生一張金鑰 QR Code(只給圖、不顯示金鑰)→ 傳給夥伴:名揚四海自動當沖 第一支手機綁定(第二支不給過);夥伴看盤 不限支數,只看該夥伴的元大真實交易 */
const $ = id => document.getElementById(id), main = $("main");
const JN = ["判一","判二","判三","判四","判五","判六","判七","判八","判九"];
const P = [];
const S = {page:"gate", cur:0, step:0};
function toast(t){ $("toastL").innerHTML = `<div class="toast">${t}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $("toastL").innerHTML = "", 2200); }
function qrSvg(t){ const q = qrcode(0, "M"); q.addData(t); q.make(); return q.createSvgTag({cellSize: 4, margin: 2, scalable: true}); }
const newKey = () => "fa11" + [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
const money = m => [["當日總額度","最多 500 萬(鐵律)"],["多空上限(每筆)","最多 25 萬(鐵律)"],["已平倉虧多少停止進場",""],["帳面虧多少全部平倉",""]]
  .map(([a, b], i) => `<label>${a}${b ? `<small>${b}</small>` : ""}<div class="unit"><input type="number" value="${m[i] / 10000}" inputmode="decimal"><span>萬</span></div></label>`).join("");
const steps = (n) => ["資料加密送到你的電腦","電腦用夥伴的帳號登入元大(用你電腦裡的憑證)","開始自動當沖","產生夥伴的金鑰 QR Code"]
  .map((t, i) => `<div class="step ${i < n ? "done" : i === n ? "now" : "todo"}"><i>${i < n ? "✓" : i + 1}</i>${t}</div>`).join("");
const USE = name => `<div class="use"><div><i class="v">夥伴看盤</i><span>${name} 裝「夥伴看盤」掃這張(或從相簿選這張),幾支手機都可以;只看得到 ${name} 的元大真實交易,不能下單、不能改設定</span></div></div>`;

function vGate(){ return `<div class="gate"><div class="card"><h2>請輸入主導$ 金鑰</h2><p class="hint">這個程式只有主導$ 能用。夥伴的金鑰打不開。</p>
  <div class="unit"><input type="password" id="gk" placeholder="主導$ 金鑰" autocomplete="off"><button type="button" class="btn blue" id="gscan" style="width:auto;padding:0 1em">掃描</button></div>
  <label class="back" style="cursor:pointer">或從相簿選 QR Code 圖片<input type="file" id="gpic" accept="image/*" hidden></label>
  <div class="hint" id="gerr" style="color:#FF8A8A;min-height:1.4em"></div>
  <button type="button" class="btn gold" id="in">進入</button></div></div>`; }
/* 只有主導$:用雲端確認是 owner 鑰匙(?pcbk=get 只有中繼金鑰 / owner 鑰匙讀得到;夥伴 fa11、看盤鑰匙會被擋) */
const KK = "join.k", kGet = () => { try{ return localStorage.getItem(KK) || ""; }catch(e){ return ""; } }, kSet = v => { try{ v ? localStorage.setItem(KK, v) : localStorage.removeItem(KK); }catch(e){} };
async function ownerOk(k){ if (!/^[a-z0-9]{16,64}$/i.test(k) || /^fa11/i.test(k)) return false;
  try{ const r = await fetch("https://twse-proxy.redwinds542688.workers.dev/?pcbk=get&k=" + encodeURIComponent(k) + "&_=" + Date.now(), {cache: "no-store", signal: AbortSignal.timeout(9000)}); return r.ok; }catch(e){ return null; } }
async function tryKey(k){ k = String(k || "").trim(); const e = $("gerr"); if (e) e.textContent = "確認中…";
  const ok = await ownerOk(k); if (ok){ kSet(k); S.page = "list"; return render(); }
  if (e) e.textContent = ok === null ? "連不上雲端,請確認網路再試" : "這不是主導$ 的金鑰(夥伴的金鑰打不開這個程式)"; }
function vList(){
  if (!P.length) return `<h2>夥伴(0 位)</h2><div class="card zero" style="align-items:center;text-align:center"><div style="font-size:calc(var(--uf) * 3.2)">👥</div><b style="font-size:calc(var(--uf) * 1.5)">還沒有夥伴</b>
    <div class="steps" style="align-self:stretch;text-align:left">
      <div class="step now"><i>1</i>先用夥伴的身分,在你的電腦申請 / 匯入元大憑證</div>
      <div class="step todo"><i>2</i>按「新增夥伴」,輸入他的元大帳號、密碼、額度</div>
      <div class="step todo"><i>3</i>電腦登入成功,自動產生他的看盤金鑰 QR Code,傳給他</div></div></div>
    <button type="button" class="btn gold" id="add">＋ 新增第一位夥伴</button>`;
  return `<h2>夥伴(${P.length} 位)</h2>${P.map((p, i) => `<div class="prow" data-i="${i}" role="button" tabindex="0"><b>${p.n}</b><span class="st ${p.st}">${p.t}</span><small>${p.d}</small></div>`).join("")}
    <button type="button" class="btn gold" id="add">＋ 新增夥伴</button>`;
}
function vNew(){ return `<button type="button" class="back" id="bk">‹ 夥伴列表</button><h2>新增夥伴</h2>
  <label>夥伴名字<input type="text" id="nm" value="小明" maxlength="12"></label>
  <div class="card"><b style="font-size:calc(var(--uf) * 1.15)">夥伴的元大資料(你輸入)</b>
    <label>證券帳號<small>分公司 4 碼 + 帳號 7 碼,例如 981R0123456</small><input type="text" value="981R0123456"></label>
    <label>電子交易密碼<input type="password" value="12345678"></label>
    <label class="ck" style="flex-direction:row;align-items:center;gap:.6em"><input type="checkbox" checked> 他的元大憑證已經裝進我的電腦(元大憑證 e 管家)</label>
    <label class="ck" style="flex-direction:row;align-items:center;gap:.6em"><input type="checkbox" checked> 他已開通元大「API 電子下單」</label></div>
  <div class="card"><b style="font-size:calc(var(--uf) * 1.15)">額度(之後隨時可改)</b>${money([1000000,100000,10000,20000])}</div>
  <div class="lock">🔒 帳號密碼在這支手機先加密,只有你的電腦解得開;雲端只轉送、不留存。存好後這裡也不再顯示密碼。</div>
  <button type="button" class="btn gold" id="send">加密送到電腦</button>`; }
function vWait(){ return `<h2>${S.nm} 設定中…</h2><div class="card steps">${steps(S.step)}</div><button type="button" class="btn" id="nx">(範例)下一步 ›</button>`; }
function vOne(){ const p = P[S.cur];
  return `<button type="button" class="back" id="bk">‹ 夥伴列表</button><h2>${p.n}</h2>
  <div class="card"><b style="font-size:calc(var(--uf) * 1.2)">${p.n} 的看盤金鑰 QR Code</b><div class="qbox">${qrSvg(p.k)}</div>
    <p class="hint" style="text-align:center">只給圖,不顯示金鑰</p>${USE(p.n)}
    <div class="row2"><button type="button" class="btn gold" id="save">存到相簿</button><button type="button" class="btn blue" id="share">傳給夥伴</button></div></div>
  <div class="card"><div class="sw"><span>自動交易</span><button type="button" class="tg on" aria-label="自動交易開關"></button></div></div>
  <div class="card"><b style="font-size:calc(var(--uf) * 1.2)">公式(點一下開 / 關)</b><div class="jg">${JN.map(j => `<button type="button" class="on">${j}</button>`).join("")}</div></div>
  <div class="card"><b style="font-size:calc(var(--uf) * 1.2)">額度</b>${money(p.m)}</div>
  <div class="card"><b style="font-size:calc(var(--uf) * 1.2)">進場張數(多空上限 ${p.m[1] / 10000} 萬)</b>
    <label class="opt${(p.lot || 1) === 1 ? " on" : ""}" data-lot="1"><input type="radio" name="lot"${(p.lot || 1) === 1 ? " checked" : ""}><span><b>① 能買幾張就幾張</b><small>上限內能買幾張買幾張(跟主導$ 現在一樣)</small></span></label>
    <label class="opt${p.lot === 2 ? " on" : ""}" data-lot="2"><input type="radio" name="lot"${p.lot === 2 ? " checked" : ""}><span><b>② 只買 1 張</b><small>上限內不管股價,每筆都只買 1 張</small></span></label>
    <label class="opt${p.lot === 3 ? " on" : ""}" data-lot="3"><input type="radio" name="lot"${p.lot === 3 ? " checked" : ""}><span><b>③ 分級</b><small>25 萬以前那套分級,照上限等比例縮小</small></span></label>
    <table class="lt"><thead><tr><th>股價</th><th>①</th><th>②</th><th>③</th></tr></thead><tbody>
    ${[15,25,40,60,90,120].map(px => `<tr><td>${px} 元</td>${[1,2,3].map(m => `<td>${lotsOf(m, p.m[1], px)}</td>`).join("")}</tr>`).join("")}
    </tbody></table><p class="hint">超額 = 1 張就超過多空上限,不進場。</p></div>

</div>`; }
function toastNoop(){}
const loadJsQR = () => window.jsQR ? Promise.resolve() : new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
async function qrDetector(){ try{ if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) return new BarcodeDetector({formats: ["qr_code"]}); }catch(e){} return null; }
function qrScan(onText, onErr){
  const w = document.createElement("div"); w.className = "mask"; w.style.cssText = "flex-direction:column;gap:14px;background:#000;z-index:60";
  w.innerHTML = '<video playsinline autoplay muted style="width:86vw;max-width:420px;aspect-ratio:1;object-fit:cover;border:3px solid #4FC3F7;border-radius:12px;background:#111"></video><div class="qmsg" style="color:#E6EAF2;font-size:16px;text-align:center;max-width:86vw">把金鑰的 QR Code 放進框內</div><button type="button" style="padding:10px 28px;font-size:18px;border-radius:10px;border:1px solid #8C96AB;background:#000;color:#E6EAF2">取消</button>';
  document.body.appendChild(w);
  const v = w.querySelector("video"), msg = w.querySelector(".qmsg"); let stream = null, done = false;
  const stop = () => { done = true; try{ stream && stream.getTracks().forEach(t => t.stop()); }catch(e){} w.remove(); };
  w.querySelector("button").onclick = stop;
  (async () => {
    try{ if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw {name: "這個開啟方式不支援相機"}; stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}, audio: false}); }
    catch(e){ msg.textContent = "打不開相機(" + (e && e.name || e) + "):請允許使用相機,或按取消改用「從相簿選 QR Code 圖片」"; return; }
    v.srcObject = stream; try{ await v.play(); }catch(e){}
    const det = await qrDetector(); if (!det){ try{ await loadJsQR(); }catch(e){ msg.textContent = "載入掃描元件失敗(請確認網路)"; return; } }
    const cv = document.createElement("canvas"), g = cv.getContext("2d", {willReadFrequently: true});
    const tick = async () => { if (done) return;
      try{ let text = null;
        if (det){ const r = await det.detect(v); if (r && r.length) text = r[0].rawValue; }
        else if (v.videoWidth){ cv.width = v.videoWidth; cv.height = v.videoHeight; g.drawImage(v, 0, 0); const im = g.getImageData(0, 0, cv.width, cv.height); const r = window.jsQR(im.data, im.width, im.height, {inversionAttempts: "dontInvert"}); if (r) text = r.data; }
        if (text){ stop(); try{ navigator.vibrate && navigator.vibrate(60); }catch(e){} onText(text); return; } }catch(e){}
      setTimeout(tick, 200); };
    tick();
  })();
}
async function qrFromImage(file){
  const img = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = () => rej("讀不到這張圖片"); im.src = u; });
  const det = await qrDetector();
  if (det){ try{ const r = await det.detect(img); if (r && r.length) return r[0].rawValue; }catch(e){} }
  try{ await loadJsQR(); }catch(e){ throw "載入掃描元件失敗(請確認網路)"; }
  const cv = document.createElement("canvas"), sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)); cv.width = img.naturalWidth * sc; cv.height = img.naturalHeight * sc;
  const g = cv.getContext("2d", {willReadFrequently: true}); g.drawImage(img, 0, 0, cv.width, cv.height); const d = g.getImageData(0, 0, cv.width, cv.height);
  const r = window.jsQR(d.data, d.width, d.height, {inversionAttempts: "attemptBoth"}); if (r) return r.data;
  throw "這張圖片裡找不到 QR Code";
}
function poster(name, key){
  const q = qrcode(0, "M"); q.addData(key); q.make(); const n = q.getModuleCount();
  const W = 1080, H = 1500, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  x.fillStyle = "#0B0E14"; x.fillRect(0, 0, W, H);
  const g = x.createLinearGradient(140, 0, 940, 0); [["#FF5A5F",0],["#FFB13B",.3],["#3DDC84",.6],["#29B6F6",.8],["#B15CFF",1]].forEach(([c2,o]) => g.addColorStop(o, c2));
  x.textAlign = "center"; x.fillStyle = g; x.font = "900 76px 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"; x.fillText("自動當沖 · 夥伴看盤", W / 2, 130);
  x.fillStyle = "#FFD54F"; x.font = "900 64px 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"; x.fillText(name + " 的看盤金鑰", W / 2, 240);
  const S = 800, ox = (W - S) / 2, oy = 300; x.fillStyle = "#fff"; x.beginPath(); x.roundRect ? x.roundRect(ox, oy, S, S, 36) : x.rect(ox, oy, S, S); x.fill();
  const m = 60, cs = (S - m * 2) / n; x.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(Math.floor(ox + m + k * cs), Math.floor(oy + m + r * cs), Math.ceil(cs), Math.ceil(cs));
  x.fillStyle = "#E6EAF2"; x.font = "500 44px 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
  x.fillText("打開「夥伴看盤」→ 按「掃描」", W / 2, 1195); x.fillText("或「從相簿選 QR Code 圖片」選這張", W / 2, 1260);
  x.fillStyle = "#8C96AB"; x.font = "500 36px 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
  x.fillText("只看得到 " + name + " 自己的元大交易", W / 2, 1360); x.fillText("請不要傳給其他人", W / 2, 1415);
  return c;
}
function showPoster(name, key){   /* 存到相簿:App(1.0.2 起)直接存進相簿「Pictures/夥伴加入」;網頁 / 舊 App 下載圖檔,並秀出圖讓你長按存 */
  const u = poster(name, key).toDataURL("image/png"), fn = `夥伴金鑰-${name}.png`, H = window.JoinHost;
  if (H && H.saveImage){ if (H.saveImage(u, fn)) return toast("✓ 已存到相簿(夥伴加入 資料夾)"); }
  else { const a = document.createElement("a"); a.href = u; a.download = fn; document.body.appendChild(a); a.click(); a.remove(); }
  $("toastL").innerHTML = `<div class="pmask"><div class="pbox"><b>長按圖片 → 儲存圖片</b><img src="${u}" alt="${name} 的金鑰圖"><button type="button" class="btn" id="pmx">關閉</button></div></div>`;
  $("pmx").onclick = () => $("toastL").innerHTML = ""; }
async function sharePoster(name, key){   /* 傳給夥伴:App 打開手機分享(LINE 等);網頁用瀏覽器分享,不支援就改存圖 */
  const c = poster(name, key), u = c.toDataURL("image/png"), fn = `夥伴金鑰-${name}.png`, txt = `${name} 的金鑰:打開「夥伴看盤」→ 從相簿選這張圖`, H = window.JoinHost;
  if (H && H.shareImage){ if (H.shareImage(u, fn, txt)) return; }
  try{ const b = await new Promise(r => c.toBlob(r, "image/png")), f = new File([b], fn, {type: "image/png"});
    if (navigator.canShare && navigator.canShare({files: [f]})) return await navigator.share({files: [f], text: txt}); }catch(e){ return; }
  showPoster(name, key); }

/* 進場張數(和電腦 trader.lots_for 的夥伴 lot_mode 同一套算法):1 能買幾張就幾張;2 只買 1 張;3 25 萬以前的分級照上限等比例縮 */
function lotsOf(m, cap, px){ if (px * 1000 > cap) return "超額"; let n;
  if (m === 2) n = 1; else if (m === 3) n = px <= 80 * cap / 250000 ? Math.max(1, Math.min(3, Math.floor(0.64 * cap / (px * 1000)))) : Math.max(1, Math.min(2, Math.floor(cap / (px * 1000))));
  else n = Math.max(1, Math.floor(cap / (px * 1000))); return n + " 張"; }
function render(){ main.innerHTML = S.page === "gate" ? vGate() : ({list: vList, new: vNew, wait: vWait, one: vOne})[S.page](); main.scrollTop = 0; }
main.addEventListener("click", e => { const o = e.target.closest(".opt[data-lot]"); if (o){ P[S.cur].lot = +o.dataset.lot; main.querySelectorAll(".opt[data-lot]").forEach(x => x.classList.toggle("on", x === o)); return; }
  const t = e.target.closest("button,.prow"); if (!t) return; const id = t.id;
  if (id === "in") return tryKey($("gk").value);
  if (id === "gscan") return qrScan(t2 => { $("gk").value = t2; tryKey(t2); }, () => {});
  if (t.classList.contains("prow")){ S.cur = +t.dataset.i; S.page = "one"; return render(); }
  if (id === "add"){ S.page = "new"; return render(); }
  if (id === "bk"){ S.page = "list"; return render(); }
  if (id === "send"){ S.m = [...main.querySelectorAll(".unit input")].map(x => Math.round((parseFloat(x.value) || 0) * 10000)); S.nm = ($("nm").value || "夥伴").trim(); S.step = 1; S.page = "wait"; return render(); }
  if (id === "nx"){ S.step++; if (S.step >= 4){ P.push({n: S.nm, st: "run", t: "自動當沖中", d: `元大已登入 · 額度 ${(S.m && S.m[0] || 1000000) / 10000} 萬`, k: newKey(), m: (S.m && S.m.length === 4 ? S.m : [1000000,100000,10000,20000]), lot: 1}); S.cur = P.length - 1; S.page = "one"; } return render(); }
  if (id === "save") return showPoster(P[S.cur].n, P[S.cur].k);
  if (id === "share") return sharePoster(P[S.cur].n, P[S.cur].k);
});
main.addEventListener("change", e => { if (e.target.id === "gpic"){ const f = e.target.files && e.target.files[0]; if (f) qrFromImage(f).then(t2 => { $("gk").value = t2; tryKey(t2); }, m => $("gerr").textContent = m); } });
if (kGet()){ S.page = "list"; ownerOk(kGet()).then(ok => { if (ok === false){ kSet(""); S.page = "gate"; render(); } }); }   /* 存過的鑰匙:先進去,背景再確認一次(被停用就回入口) */
render();
try{ const H = window.JoinHost; $("ver").textContent = H ? `App ${H.version()}${H.offline() ? " 離線" : ""}` : "網頁版"; }catch(e){}
