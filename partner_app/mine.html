<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 夥伴看盤:一進來要金鑰;只讀金鑰對應帳號的元大真實資料;當沖 / 明細 + 喇叭靜音 + 金鑰(可掃 QR)。Android App 版:partner_app/android 把這個檔包進去;網址版:雲端 /partner/(iPhone / iPad / 電腦加到主畫面)。和名揚四海 app/ 完全分開 -->
<link rel="manifest" href="/partner/manifest.webmanifest">
<link rel="apple-touch-icon" href="/partner/icon-180.png">
<link rel="icon" type="image/png" href="/partner/icon-192.png">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夥伴看盤">
<title>夥伴看盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面:照主導版(名揚四海)的樣子簡化 —— 上標題、標題列(分頁名 / 日期 / 喇叭 / 金額)、中間清單、底部 進場 / 當沖 / 明細 三鍵;單一深色,台股紅漲綠跌 */
:root{
  --ground:#05070B; --bg:#0B0E14; --card:#151B28; --card2:#111827; --line:#2A3244; --line2:#3A4357;
  --fg:#E6EAF2; --sub:#8C96AB; --soft:#C9D1DF; --gold:#FFD54F; --green:#22E06B; --blue:#29B6F6;
  --up:#FF4D5E; --down:#2EE59D; --bad:#FF3B3B;
  --f:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* 手機「字型大小」調大時,瀏覽器 / 預覽不要自己把字放大(會撐破版面、可以左右滑) */
body{background:var(--ground);color:var(--fg);font-family:var(--f);margin:0}
*{box-sizing:border-box}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;height:100%;padding-top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;flex-direction:column}
.pv{padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:#0E121A;border-bottom:1px dashed var(--line2);font-size:12px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pv b{color:var(--gold)}
.pv button.on{border-color:var(--gold);color:var(--gold)}
.pv button{height:30px;padding:0 8px;border-radius:15px;border:1px solid var(--line2);background:transparent;color:var(--soft);font-size:12px;cursor:pointer}
.ttl{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ttl h1{margin:0;font-size:clamp(22px,7vw,30px);font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#FF5A5F,#FFB13B 30%,#3DDC84 60%,#29B6F6 80%,#B15CFF);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.ttl{align-items:center}
.key{cursor:default !important;border-color:transparent !important;background:transparent !important;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:#0E121A;color:var(--soft);font:500 14px var(--f);cursor:pointer;white-space:nowrap}
.ver{font-size:12px;color:var(--sub);margin-left:auto}   /* 版本號:App 版顯示 App 版本,網址版顯示「網頁版」(2026-11-15 使用者截圖還是舊版才跳列,看不出版本) */
.key.none{border-color:var(--gold);color:var(--gold);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(3,5,9,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.dlg{width:100%;max-width:380px;background:#151B28;border:2px solid var(--gold);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:20px;font-weight:900;color:var(--gold)}
.dlg p{margin:0;font-size:14px;color:#B8C1D3;line-height:1.6}
.dlg input{height:50px;border-radius:10px;border:1px solid var(--line2);background:#0B0E14;color:var(--fg);font:500 18px ui-monospace,monospace;padding:0 12px;letter-spacing:1px}
.qrb{flex:none;height:50px;padding:0 14px;border-radius:10px;border:1px solid #4FC3F7;background:#0B1A26;color:#4FC3F7;font:700 17px var(--f);cursor:pointer}
.qrpic{font-size:14px;color:#4FC3F7;text-decoration:underline;cursor:pointer;align-self:flex-start}
.mask.gate{background:var(--bg);z-index:50} .gtitle{font-size:clamp(20px,6vw,24px);font-weight:900;color:var(--gold);text-align:center;margin-bottom:4px}
.dlg .err{min-height:18px;font-size:14px;color:#FF8A8A}
.dlg .bt{display:flex;gap:8px} .dlg .bt button{flex:1;height:48px;border-radius:10px;font:700 17px var(--f);cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--soft)}
.dlg .bt .ok{background:var(--gold);border-color:var(--gold);color:#000}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid #5A4A10;border-width:1px 0;min-height:0}
.hd{display:flex;gap:6px;align-items:center;padding:8px 6px;flex-wrap:nowrap}   /* 17:50 使用者「輸贏金額 跳列 太長就縮小字體」:金額不換行,太長自動縮字(fitText) */
.tab{height:46px;padding:0 12px;border-radius:9px;border:2px solid var(--green);background:#000;color:var(--green);font:900 22px var(--f);display:flex;align-items:center;box-shadow:0 0 0 2px #000,0 0 0 3.5px #8C96AB}
.date{height:46px;padding:0 10px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;font-size:22px;color:var(--soft);font-variant-numeric:tabular-nums}
.spk{height:46px;width:58px;border-radius:9px;border:2px solid #6b6f7a;background:#000;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 2px #000,0 0 0 3.5px #4A5570;padding:0}
.spk.on{background:var(--gold);color:#000;border-color:#fff;box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--gold)}
.amt{flex:1 1 0;min-width:0;overflow:hidden;text-align:right;font-size:clamp(22px,7.4vw,32px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)} .dn{color:var(--down)} .mut{color:var(--sub)} .gold{color:var(--gold)}
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;transform:translateZ(0);will-change:scroll-position;display:flex;flex-direction:column;scroll-snap-type:y mandatory;overscroll-behavior:none}
/* 一頁固定 8 檔、不切半列(17:50 使用者「照這樣 一頁 八檔 不要切到」):列高 = 清單高度 ÷ 8(太矮的螢幕少放幾檔),滑動一格一格對齊 */
/* 19:15 使用者「要順暢」:列底改單色(斜紋每列都要重畫,手機滑起來會卡)、清單用 GPU 圖層、每列各自排版不互相影響 */
.list > .prow2:nth-child(even),.list > .row:nth-child(even){background:#151D2C}
.list > .prow2,.list > .row,.list > .dsep,.list > .dend,.list > .drow{contain:layout paint;height:var(--rh,auto);align-content:center;flex:none;scroll-snap-align:start;padding-top:0;padding-bottom:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:9px 8px;border-bottom:1px solid #1E2636;background:#131A28}
.nm{min-width:0} .nm b{display:block;font-size:clamp(16px,5vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm small{display:block;font-size:14px;color:var(--green);font-variant-numeric:tabular-nums}
.px{text-align:right;font-variant-numeric:tabular-nums} .px b{font-size:clamp(15px,4.8vw,19px);white-space:nowrap} .px small{display:block;font-size:13px;color:var(--sub)}
.sd{display:inline-block;font-size:14px;font-weight:700;border:1px solid;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:2px}
.sd.s{color:var(--down);border-color:var(--down)} .sd.l{color:var(--up);border-color:var(--up)}
.js{display:inline-block;font-size:12px;color:var(--gold);border:1px solid #8A7320;border-radius:4px;padding:0 4px;margin-left:4px}
.rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums}
.rt b{font-size:18px;font-weight:900} .rt small{font-size:13px;color:var(--sub)}
.wl{font-size:12px;font-weight:700;border:1px solid;border-radius:4px;padding:0 4px}
.wl.w{color:var(--up);border-color:var(--up)} .wl.l{color:var(--down);border-color:var(--down)} .wl.o{color:var(--sub);border-color:var(--line2)}
/* 18:20 使用者「現價 與 做空價 對調 … 箭頭取消」:現價 | 做空(進場)價 | 帳面,兩個價格都靠右上下對齊;下一行 現價 / 做空 N張 / 帳面 */
/* 當沖列(2026-11-15 使用者附圖「照這樣」;17:05「做空 3張 要移到 進場價格下面 箭頭後面接連 現在價格」):一行「進場價 → 現價 輸贏」,下一行 做空 N張(進場價下面)/ 現價 / 帳面;進場價、箭頭、現價、輸贏各一欄固定寬度 → 上下列對齊 */
.prow2{display:grid;grid-template-columns:minmax(0,1fr) clamp(62px,19vw,80px) clamp(68px,21vw,88px) clamp(64px,20vw,84px);column-gap:clamp(4px,1.6vw,8px);row-gap:3px;align-items:center;padding:9px 8px;border-bottom:1px solid #1E2636;background:#131A28}
.prow2 .nm{grid-row:1 / span 2;min-width:0} .prow2 .nm b{display:block;font-size:clamp(16px,5vw,19px)}
.prow2 .cd{display:flex;gap:4px;align-items:baseline;flex-wrap:nowrap;white-space:nowrap;font-size:clamp(12px,3.9vw,14px);font-variant-numeric:tabular-nums}
.prow2 .cd i{font-style:normal;color:var(--green)} .prow2 .cd em{font-style:normal;font-weight:700}
.prow2 .n{min-width:0;overflow:hidden;text-align:right;font-size:clamp(15px,4.8vw,19px);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow2 .ar{text-align:center;color:var(--soft);font-size:16px}
.prow2 .n.l{text-align:left}
.prow2 .n.sm{font-size:clamp(12px,3.7vw,16px)} .prow2 .pl{padding-left:4px} .prow2 .pl.sm{font-size:clamp(13px,4vw,17px)}   /* 千元以上的價格、六位數輸贏字小一點,窄手機也不擠 */   /* 現價靠左、緊貼箭頭;進場價靠右(17:10 使用者「現價 要緊貼箭頭後面顯示 進場價格是右對齊 現價是左對齊」) */
.prow2 .pl{min-width:0;overflow:hidden;text-align:right;font-size:clamp(15px,4.8vw,19px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow2 .sub{grid-column:3;display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:13px;color:var(--sub);white-space:nowrap}
.prow2 .now{grid-column:2;text-align:right;font-size:13px;color:var(--sub)}
.prow2 .sub .sd{margin-left:0} .prow2 .tg{text-align:right;font-size:13px;color:var(--sub)}
.dsep{display:flex;align-items:center;gap:10px;padding:0 10px;background:#1A2234;border-bottom:1px solid #2A3244;font-variant-numeric:tabular-nums}
.dsep b{font-size:clamp(16px,5vw,19px);color:var(--gold)} .dsep span{font-size:14px;color:var(--sub)} .dsep em{margin-left:auto;font-style:normal;font-weight:900;font-size:clamp(16px,5vw,19px)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:calc(var(--u) * .6);padding:0 calc(var(--u) * .75);border-bottom:1px solid #1E2636;background:#131A28;font-variant-numeric:tabular-nums}
.list > .drow:nth-child(even){background:#151D2C} .drow b{font-size:calc(var(--uf) * 1.39);color:var(--gold)} .drow span{font-size:calc(var(--uf) * 1.02);color:var(--sub)} .drow em{font-style:normal;font-weight:900;text-align:right;font-size:calc(var(--uf) * 1.5)}
#hd .amt{cursor:pointer}
.dend{flex:none;padding:0 14px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:13px}
.days{display:flex;gap:6px;overflow-x:auto;padding:0 6px 8px}
.day{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line2);background:transparent;color:var(--soft);font:500 15px var(--f);cursor:pointer}
.day.on{border-color:var(--gold);background:#2A2410;color:var(--gold);font-weight:700}
.stt{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;color:var(--soft)}
.dot{width:9px;height:9px;border-radius:5px;background:var(--green);flex:none} .dot.r{background:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:15px}
.note{margin:10px 8px;padding:10px 12px;border-radius:10px;background:#111725;border:1px solid var(--line);font-size:13px;color:#B8C1D3;line-height:1.6}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 8px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);position:sticky;bottom:0;border-top:1px solid var(--line)}
nav button{height:56px;border-radius:10px;border:1px solid var(--gold);background:linear-gradient(#1E2638,#151B28);color:var(--soft);font:900 24px var(--f);cursor:pointer;letter-spacing:2px}
nav button.on{color:var(--green);border:2px solid var(--green)}
.toast{z-index:70;position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(92vw,420px);border-radius:12px;padding:10px 14px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:2px;animation:drop .25s ease-out}
.toast b{font-size:17px} .toast span{font-size:13px;opacity:.85}
.toast.long,.toast.short,.toast.pc{background:#14233A;border:1px solid var(--blue);color:#CDE9FF}
.toast.profit,.toast.win{background:#2A1416;border:1px solid var(--up);color:#FFD0D3}
.toast.loss,.toast.lv{background:#0E2A1C;border:2px solid var(--down);color:#C9FFE5}
/* 2026-11-15 平板 / 電腦(使用者「照這樣做」):螢幕寬就整個畫面放大(版面、欄位對齊、一頁 8 檔都不變),不會只有中間一小條 */
/*   直的平板 1.3 倍;橫的平板 / 電腦螢幕比較矮,放大少一點(不然一頁放不下 8 檔);很大的螢幕 1.5 倍 */
/* 2026-11-15 19:20 使用者「主程式 自動適配 手機 平板 電腦都很好 這看盤版 怎麼這麼不好」:改用主程式同一套適配(app.html --u / --uf):
   1 格 = 螢幕寬 ÷ 30(欄寬,整列鋪滿寬度,不留左右邊);字、按鈕、圖示用 --uf = min(寬 ÷ 30, 高 × 0.62 ÷ 30)(寬螢幕照高度算,不會太大塞不下 8 檔);
   不再整頁 zoom、不再 460px 置中。手機(412 寬)大小跟原本一樣 */
:root{--u:calc(100vw / 30);--uf:min(calc(100vw / 30), calc(62vh / 30))}
.wrap{max-width:none}
.list{scrollbar-width:none} .list::-webkit-scrollbar{display:none}   /* 電腦捲軸藏起來(會吃掉右邊、欄位對不齊),滾輪 / 拖曳照樣能捲 */
.ttl{padding:calc(var(--uf) * .7) calc(var(--u) * .6);gap:calc(var(--uf) * .6)}
.ttl h1{font-size:calc(var(--uf) * 2.2)}
.key{height:calc(var(--uf) * 2.5);padding:0 calc(var(--uf) * .7);font-size:calc(var(--uf) * 1.02);border-radius:calc(var(--uf) * .6);gap:calc(var(--uf) * .35)}
/* 11/16 21:20 使用者「把 主導$ 顯示在第一列 夥伴看盤後面 第二列 不用顯示」+ 21:25「下面顯示版本」:標題一行到底,右邊 身分鈕 + 正下方版本號 */
.ttl{flex-wrap:nowrap} .ttl h1{min-width:0;flex:0 1 auto;overflow:hidden}
.kv{flex:none;margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--uf) * .15)}
.kv .ver{position:static;margin:0;font-size:calc(var(--uf) * .72);line-height:1;white-space:nowrap}
.ttl{position:relative} .ver{font-size:calc(var(--uf) * .8);position:absolute;right:calc(var(--u) * .5);bottom:calc(var(--uf) * .25);margin:0}   /* 版本號貼右下角,不再自己佔一行(一頁 8 檔的空間) */
.hd{gap:calc(var(--uf) * .45);padding:calc(var(--uf) * .6) calc(var(--u) * .45)}
.tab,.date{height:calc(var(--uf) * 3.35);font-size:calc(var(--uf) * 1.6);border-radius:calc(var(--uf) * .65)}
.tab{padding:0 calc(var(--uf) * .85)} .date{padding:0 calc(var(--uf) * .7)}
.spk{height:calc(var(--uf) * 3.35);width:calc(var(--uf) * 4.2);border-radius:calc(var(--uf) * .65)} .spk svg{width:calc(var(--uf) * 2.2);height:calc(var(--uf) * 2.2)}
.amt{font-size:calc(var(--uf) * 2.35)}
.stt{font-size:calc(var(--uf) * .95);padding:calc(var(--uf) * .45) calc(var(--u) * .6);gap:calc(var(--uf) * .6)} .dot{width:calc(var(--uf) * .65);height:calc(var(--uf) * .65);border-radius:50%}
.prow2{grid-template-columns:minmax(0,1fr) calc(var(--u) * 6) calc(var(--u) * 6.4) calc(var(--u) * 6.4);column-gap:calc(var(--u) * .4);row-gap:calc(var(--uf) * .2);padding:0 calc(var(--u) * .6)}
.prow2 .nm b{font-size:calc(var(--uf) * 1.39)} .prow2 .cd{font-size:calc(var(--uf) * 1.02);gap:calc(var(--uf) * .3)}
.prow2 .n,.prow2 .pl{font-size:calc(var(--uf) * 1.39)} .prow2 .n.sm{font-size:calc(var(--uf) * 1.17)} .prow2 .pl.sm{font-size:calc(var(--uf) * 1.24)} .prow2 .pl{padding-left:calc(var(--uf) * .3)}
.prow2 .sub,.prow2 .now,.prow2 .tg{font-size:calc(var(--uf) * .95)} .prow2 .sub{gap:calc(var(--uf) * .2)}
.sd{font-size:calc(var(--uf) * 1.02);border-radius:calc(var(--uf) * .3);padding:0 calc(var(--uf) * .3)}
.dsep{padding:0 calc(var(--u) * .75);gap:calc(var(--uf) * .7)} .dsep b,.dsep em{font-size:calc(var(--uf) * 1.39)} .dsep span{font-size:calc(var(--uf) * 1.02)}
.dend{font-size:calc(var(--uf) * .95)} .empty{font-size:calc(var(--uf) * 1.1);padding:calc(var(--uf) * 2) calc(var(--u))}
nav{gap:calc(var(--u) * .6);padding:calc(var(--uf) * .7) calc(var(--u) * .6) calc(var(--uf) * .85 + env(safe-area-inset-bottom,0px))}
nav button{height:calc(var(--uf) * 4.1);font-size:calc(var(--uf) * 1.75);border-radius:calc(var(--uf) * .75)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="ttl"><h1>自動當沖 · 夥伴看盤</h1><div class="kv"><button type="button" class="key" id="keyBtn"></button><span class="ver" id="ver"></span></div></div>
  <section class="panel"><div class="hd" id="hd"></div><div id="pre"></div><div class="list" id="list"></div></section>
  <nav id="nav"></nav>
</div>

    ks.map(d => `<div class="dsep" data-sep="${d}"><b>${dayLabel(d)}</b><span>${DAYS[d].length} 筆</span><em class="${cls(dayTot(d))}">${fmt(dayTot(d))}</em></div>` + DAYS[d].map(fillRow).join("")).join("")
    + (ST.loading ? `<div class="dsep"><span>讀取更早的紀錄…</span></div>` : "")];
}
// 捲動時:標題列換成目前最上面那天
function doneSync(force){ try{ if (S.tab !== "明細" || S.days) return;   /* 2026-11-21 使用者影片:每日畫面的總計被這裡換回最上面那天 → 每日畫面不換 */ if (force) S.day = null; const L = document.getElementById("list"), top = L.getBoundingClientRect().top + 2;
  let cur = null; for (const e of L.querySelectorAll(".dsep")){ if (e.getBoundingClientRect().top <= top) cur = e.dataset.sep; else break; }
  cur = cur || Object.keys(DAYS)[0]; if (cur === S.day) return; S.day = cur;
  const t = dayTot(cur), hd = document.getElementById("hd"); hd.querySelector(".date").textContent = cur; const a = hd.querySelector(".amt"); a.textContent = fmt(t); a.className = "amt " + cls(t); }catch(e){} }
const PER_PAGE = 8;
const minRow = () => 3.2 * Math.min(window.innerWidth / 30, window.innerHeight * 0.62 / 30);   /* 最矮列高跟著 --uf(主程式同一套適配) */
/* 19:10 使用者「資料 滑到底 怎麼有彈性」:列高取整數、清單高度剛好 = 列高 × 檔數(滑到底不會因為零點幾 px 對不齊而彈回);拿掉滑到頭 / 底的拉伸效果 */
function fit(){ try{ const L = document.getElementById("list"); L.style.flex = ""; L.style.height = ""; const H = L.clientHeight; if (!H) return;
  let n = PER_PAGE; const MR = minRow(); if (H / n < MR) n = Math.max(1, Math.floor(H / MR));
  const rh = Math.floor(H / n); L.style.setProperty("--rh", rh + "px"); L.style.flex = "none"; L.style.height = (rh * n) + "px"; }catch(e){} }
window.addEventListener("resize", () => { fit(); fitText(); });
/* 數字放不下就一點一點縮小字(最小 10px),不換行、不被切掉:標題列的總輸贏、每列的價格和輸贏。
   手機字體設定調大時(Android 大字)特別需要 */
function fitText(){ try{
  for (const el of document.querySelectorAll("#hd .amt, #list .prow2 .n, #list .prow2 .pl")){
    el.style.fontSize = ""; let fs = parseFloat(getComputedStyle(el).fontSize) || 16, k = 0;
    while (el.scrollWidth > el.clientWidth + 0.5 && fs > 10 && k++ < 30){ fs -= 1; el.style.fontSize = fs + "px"; } } }catch(e){} }

function render(){
  const v = S.tab==="當沖" ? vPos() : S.days ? vDays() : vDone(), h = v[0], pre = v.length > 2 ? v[1] : "", l = v[v.length - 1];
  const set = (id, v) => { const e = document.getElementById(id); if (e.__v !== v){ e.__v = v; e.innerHTML = v; } };   // 沒變就不重畫(滑動中不會被打斷)
  set("hd", h); set("pre", pre); set("list", l); fit(); fitText();
  document.getElementById("nav").innerHTML = ["當沖","明細"].map(t=>`<button type="button" class="${S.tab===t?"on":""}" data-tab="${t}" aria-current="${S.tab===t?"page":"false"}">${t}</button>`).join("");
}
document.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  if (b.id === "spk" && coexist()){ notifyQuiet("名揚四海正開著:由名揚四海響,夥伴看盤不響也不震"); return; }
  if (b.id === "spk"){ const m = !muted(); sndSet(m); MUTED_MEM = m; render(); notifyQuiet(m ? "這台靜音(不響,震動照舊)" : "這台通知有聲音"); if (!m) webSnd("long", ""); return; }
  if (b.dataset.tab){ if (S.days){ S.days = false; try{ history.back(); }catch(x){} } S.tab = b.dataset.tab; S.day = null; render(); document.getElementById("list").scrollTop = 0; return; }
  if (b.id === "keyBtn") return;   /* 2026-11-18 使用者「金鑰通過後 這看盤版就專屬金鑰主人的 不需要更換他人的功能」:按了沒反應 */
});
function notifyQuiet(t){ const L = document.getElementById('toastL'); L.innerHTML = `<div class="toast pc" role="status"><b>${esc(t)}</b></div>`; clearTimeout(notify.t); notify.t = setTimeout(() => L.innerHTML = '', 1800); }
start();
try{ const H = window.PartnerHost; document.getElementById("ver").textContent = H && H.version ? "v" + H.version() + (H.cloud && !H.cloud() ? " 離線" : "") : "網頁版"; }catch(e){}   /* 1.0.16 起畫面讀雲端;沒網路用 App 內建那份時標「離線」 */
// 字型(Noto Sans TC)下載完數字會變寬 → 再縮一次字;畫面大小變了也再算
try{ document.fonts && document.fonts.ready.then(() => { fit(); fitText(); }); document.fonts && document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => fitText()); }catch(e){}
// 網址版(/partner/,iPhone / iPad / 電腦加到主畫面)才註冊;App(APK)裡不用
try{ if (/^\/partner/.test(location.pathname) && "serviceWorker" in navigator) navigator.serviceWorker.register("/partner/sw.js", {scope: "/partner/"}).catch(() => {}); }catch(e){}
document.getElementById("list").addEventListener("scroll", () => { doneSync(); const L = document.getElementById("list"); if (S.tab === "明細" && L.scrollTop + L.clientHeight > L.scrollHeight - 3 * L.clientHeight / 8) loadMore(); }, {passive: true});
</script>
</body>
